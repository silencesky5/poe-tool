# PoE 工具箱：Discord 登入＋雲端倉庫
# 密鑰一律用 wrangler secret put，不要寫進這個檔案：
#   DISCORD_CLIENT_SECRET  Discord 應用程式的 OAuth2 Client Secret
#   SESSION_SECRET         登入 token 的簽章密鑰（隨機 32 bytes 以上）
#   SHARE_WEBHOOK_URL      公會分享的 Discord Webhook 網址（發到 💬poe閒聊；沒設定就不發通知）
name = "poe-tool-auth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
DISCORD_CLIENT_ID = "1561438923300016258"   # 公會 Bot 的應用程式 ID（公開資訊）
GUILD_ID = "841242336012271616"             # RKSA 公會伺服器
SITE_ORIGIN = "https://silencesky5.github.io"
SITE_PATH = "/poe-tool/"
REQUIRED_ROLE_ID = ""                       # 留空＝伺服器成員都可以；之後可填身分組 ID
OFFICER_ROLE_ID = "841243515668791297"      # 團隊幹部（公會 Bot config.json 的 ids.officer）：可以撤下任何人的分享
# 公會分享架上限：每人最多幾件、全架最多幾件、SHARE_WINDOW_SEC 秒內最多分享幾件
SHARE_PER_USER = "10"
SHARE_TOTAL = "100"
SHARE_PER_WINDOW = "3"
SHARE_WINDOW_SEC = "60"

# 製裝存檔：D1 的 stash 表（schema.sql）
[[d1_databases]]
binding = "CRAFT_DB"
database_name = "poe-tool-craft"
database_id = "dba4a272-5663-4af0-a1dc-c75ebf85443d"

# KV：登出版本號 ver:<discord id>。舊的存檔 stash:<discord id> 已搬到 D1，暫時保留不刪。
[[kv_namespaces]]
binding = "CRAFT_STASH"
id = "fc1cc83b5b354c37b5aab4565ee30dd1"

# 每人每分鐘最多 30 次 PUT
[[ratelimits]]
name = "PUT_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 公會分享架「複製」：每個 IP 每分鐘最多 30 次（未登入也能複製，防止灌被複製次數）
[[ratelimits]]
name = "COPY_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
