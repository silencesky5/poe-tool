<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE 工具箱</title>
<style>
:root{
    --ink:#0D0C0B; --card:#17141199; --card-hi:#1F1B17; --edge:#2C2620; --edge-hi:#443A2E;
    --bone:#E3D8C4; --muted:#8B7F6E; --dim:#645B4F;
    --unique:#C77C2E; --curr:#C9AB6E; --divi:#57A8A0; --frag:#9A8F7E; --gem:#1F9E97;
    --uber:#C2503F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti TC","Noto Serif TC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  

    --ink:#0C0B0A; --card:#16130F; --edge:#2A241D; --edge-hi:#463A2C;
    --bone:#E5DAC6; --muted:#8B7F6E; --dim:#5F574C; --accent:#C77C2E;
    /* 想換字體改這三行就好。Windows 上實際跑的多半是 Palatino Linotype 或 Georgia。 */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti TC","Noto Serif TC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
/* Georgia 這類襯線體預設用「舊式數字」，3、5 會掉到基線以下（v3.5 看起來歪歪的）。
   強制用對齊基線的數字。 */
body{font-variant-numeric:lining-nums}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1000px 500px at 15% -8%,#1C1814 0%,transparent 55%),var(--ink);
  color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
#shell{max-width:1300px;margin:0 auto;padding:22px 18px 0}
#shell .brand{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
#shell h1{font-family:var(--serif);font-size:clamp(19px,3.6vw,26px);font-weight:500;
  letter-spacing:.18em;margin:0;color:#9A8D7C}
#shell h1 b{color:var(--bone);font-weight:500}
#shell .tabs{display:flex;gap:8px}
#shell .tab{background:#1B1713;border:1px solid #4A3F32;color:#B3A692;font-family:var(--sans);
  font-size:14px;font-weight:500;padding:9px 20px;border-radius:99px;cursor:pointer;transition:all .15s}
#shell .tab:hover{border-color:#6B5B48;color:#fff;background:#241E18}
#shell .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);
  color:#120E0A;box-shadow:0 0 16px rgba(199,124,46,.3)}
#shell .tab:focus-visible{outline:2px solid #57A8A0;outline-offset:2px}
#shell hr{border:none;border-top:1px solid #2C2620;margin:16px 0 0}
[hidden]{display:none!important}
#tab-drops,#tab-filter,#tab-beast,#tab-tali,#tab-math,#tab-scarab,#tab-strat{max-width:1300px;margin:0 auto;padding:0 18px}
/* 滿版：左右不留白，寬螢幕一行能塞更多卡片 */
body.wide #shell{max-width:none}
body.wide #tab-drops,body.wide #tab-filter,body.wide #tab-beast,body.wide #tab-tali,
body.wide #tab-math,body.wide #tab-scarab,body.wide #tab-strat,
body.wide #tab-drops .wrap{max-width:none}
#tab-drops *{box-sizing:border-box}
#tab-drops,#tab-drops .wrap{max-width:1240px;margin:0 auto;padding:26px 20px 70px}
#tab-drops .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
#tab-drops h1{font-family:var(--serif);font-size:clamp(24px,4.5vw,34px);font-weight:500;letter-spacing:.16em;margin:0}
#tab-drops h1 span{color:var(--unique)}
#tab-drops .tally{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}
#tab-drops .tally b{color:var(--unique);font-weight:500}
#tab-drops .search{position:relative;margin-bottom:14px}
#tab-drops input{width:100%;background:#14110F;border:1px solid var(--edge);color:var(--bone);font-family:var(--sans);
    font-size:15px;padding:13px 46px 13px 15px;border-radius:3px;outline:none;transition:border-color .15s}
#tab-drops input:focus{border-color:var(--unique)}
#tab-drops input::placeholder{color:#5F564B}
#tab-drops .slash{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-family:var(--mono);
    font-size:10px;color:var(--dim);border:1px solid var(--edge);border-radius:3px;padding:2px 6px;pointer-events:none}
#tab-drops .groups{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
#tab-drops .chip{background:#1B1713;border:1px solid #4A3F32;color:#B3A692;font-family:var(--sans);
    font-size:13.5px;font-weight:500;padding:7px 16px;border-radius:99px;cursor:pointer;transition:all .15s}
#tab-drops .chip:hover{border-color:#6B5B48;color:#fff;background:#241E18}
#tab-drops .chip[aria-pressed="true"],#tab-drops .chip[aria-pressed="true"]:hover{
    background:var(--unique);border-color:var(--unique);color:#120E0A;
    box-shadow:0 0 14px rgba(199,124,46,.3)}
#tab-drops .chip:focus-visible,#tab-drops input:focus-visible,#tab-drops .mode:focus-visible,#tab-drops .act:focus-visible{outline:2px solid var(--divi);outline-offset:2px}
#tab-drops .toggles{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:-12px 0 10px}
#tab-drops .wallbar{display:flex;align-items:center;gap:9px;margin:0 0 18px}
#tab-drops .tlabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#877C6C;
    text-transform:uppercase;margin-right:3px}
#tab-drops .tog{display:inline-flex;align-items:center;gap:8px;background:#1B1713;border:1px solid #4A3F32;
    color:#9C907E;font-family:var(--sans);font-size:13px;padding:6px 15px;border-radius:99px;
    cursor:pointer;transition:all .15s}
#tab-drops .tog:hover{border-color:#6B5B48;color:#fff;background:#241E18}
#tab-drops .tog::before{content:"";width:8px;height:8px;border-radius:50%;
    background:#443A2E;border:1px solid #574A3B;transition:all .15s}
.tog[data-k="rate"][aria-pressed="true"]{border-color:#7A6B58;color:#EDE2CC;background:#241E18}
#tab-drops .tog[data-k="rate"][aria-pressed="true"]::before{background:#CFC2AA;border-color:#CFC2AA;
    box-shadow:0 0 9px rgba(207,194,170,.75)}
#tab-drops .tog[data-k="dust"][aria-pressed="true"]{border-color:rgba(127,182,232,.5);color:#A8DCFF;
    background:rgba(127,182,232,.1)}
#tab-drops .tog[data-k="dust"][aria-pressed="true"]::before{background:#7FB6E8;border-color:#7FB6E8;
    box-shadow:0 0 9px rgba(127,182,232,.85)}
#tab-drops .tog:focus-visible{outline:2px solid var(--divi);outline-offset:2px}
.dust{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.02em;
    border-radius:3px;padding:3px 9px;flex-shrink:0;border:1px solid}
#tab-drops .dust.d1{color:#6F87A8;background:rgba(111,135,168,.07);border-color:#2E3743}
#tab-drops .dust.d2{color:#7FB6E8;background:rgba(127,182,232,.11);border-color:rgba(127,182,232,.34)}
#tab-drops .dust.d3{color:#A8DCFF;background:rgba(168,220,255,.15);border-color:rgba(168,220,255,.5);
    box-shadow:0 0 12px rgba(168,220,255,.2)}
#tab-drops .wall{display:block}
/* 一列 = 一組卡片（欄數由上方的輸入框決定），太高的列會收起來 */
#tab-drops .rowgrp{margin-bottom:16px;--cap:620px}
#tab-drops .rowcards{display:grid;gap:16px;align-items:start;
    grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
#tab-drops .rowgrp.cap:not(.on) .rowcards{max-height:var(--cap);overflow:hidden;position:relative}
#tab-drops .rowgrp.cap:not(.on) .rowcards::after{content:"";position:absolute;left:0;right:0;bottom:0;
    height:110px;pointer-events:none;
    background:linear-gradient(180deg,rgba(13,11,10,0),rgba(13,11,10,.72) 55%,rgba(13,11,10,.95))}
#tab-drops .rowbar{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;
    align-items:center;gap:13px;margin-bottom:12px;padding:12px 18px;
    border-radius:7px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,rgba(201,171,110,.15),rgba(201,171,110,.06));
    border:1px solid rgba(201,171,110,.42);
    transition:background .14s,border-color .14s,transform .08s}
#tab-drops .rowbar:hover{background:linear-gradient(180deg,rgba(201,171,110,.26),rgba(201,171,110,.12));
    border-color:rgba(201,171,110,.9)}
#tab-drops .rowbar:active{transform:translateY(1px)}
#tab-drops .rowbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tab-drops .rcar{width:0;height:0;flex-shrink:0;justify-self:start;
    border-left:10px solid #E0B24A;border-top:7px solid transparent;border-bottom:7px solid transparent;
    transition:transform .17s}
#tab-drops .rowgrp.on .rcar{transform:rotate(90deg)}
#tab-drops .rnames{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;overflow:hidden}
#tab-drops .rchip{flex:0 1 auto;min-width:0;font-family:var(--serif);font-size:16.5px;
    color:#EBD9AE;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:rgba(0,0,0,.3);border:1px solid rgba(201,171,110,.36);
    border-radius:6px;padding:5px 13px;transition:background .14s,border-color .14s}
#tab-drops .rowbar:hover .rchip{background:rgba(0,0,0,.42);border-color:rgba(201,171,110,.75)}
#tab-drops .rmore{flex-shrink:0;justify-self:end;font-family:var(--sans);font-size:13.5px;font-weight:600;
    letter-spacing:.06em;color:#1A1510;background:var(--accent);
    border:1px solid var(--accent);border-radius:99px;padding:6px 18px;transition:all .14s}
#tab-drops .rowbar:hover .rmore{background:#E09A42;border-color:#E09A42}
/* 展開後按鈕退成線框，讓「還沒展開」的那些更顯眼 */
#tab-drops .rowgrp.on .rmore{background:transparent;color:#C9A227;border-color:rgba(201,171,110,.55)}
#tab-drops .rowgrp.on .rowbar:hover .rmore{background:rgba(201,171,110,.16);color:#EBD9AE}
#tab-drops .colbox{display:inline-flex;align-items:center;gap:7px;margin-left:auto;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#877C6C;text-transform:uppercase}
#tab-drops .colbox select{background:#14110F;border:1px solid #4A3F32;color:var(--bone);
    font-family:var(--mono);font-size:13px;text-align:center;padding:5px 6px;border-radius:99px;outline:none}
#tab-drops .colbox select:focus{border-color:var(--accent)}
@media(max-width:860px){#tab-drops .rowcards{grid-template-columns:1fr!important}}
#tab-drops .blink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:#57A8A0;
    text-decoration:none;border-bottom:1px solid transparent;transition:color .14s,border-color .14s}
#tab-drops .blink:hover{color:#7FD0C8;border-bottom-color:rgba(127,208,200,.5)}
#tab-drops .blink::before{content:"";width:0;height:0;flex-shrink:0;
    border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
#tab-drops .boss{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--edge);
    border-radius:5px;overflow:hidden;animation:rise .28s ease both;transition:border-color .2s}
#tab-drops .boss:hover{border-color:var(--edge-hi)}
#tab-drops .boss{--ta:#C77C2E;--ta-soft:rgba(199,124,46,.45);--ta-glow:rgba(199,124,46,.35);--ta-lite:#E8B37A}
/* 切階段時外框和標題都維持原色，只有階段按鈕會跟著變 */
#tab-drops .boss.shifted{border-color:var(--edge)}
#tab-drops .hero{position:relative;aspect-ratio:16/7;background:#141110 center/cover no-repeat;display:flex;align-items:flex-end}
#tab-drops .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(13,12,11,.15),rgba(13,12,11,.55) 55%,#1F1B17)}
#tab-drops .boss.shifted .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(14,10,9,.62) 55%,#1F1B17)}
#tab-drops .boss.shifted .hero{box-shadow:inset 0 0 90px -20px var(--ta-glow)}
#tab-drops .hero .htxt{position:relative;z-index:1;padding:14px 18px 12px;width:100%}
#tab-drops .plainhead{padding:18px 18px 0}
#tab-drops .bh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#tab-drops .bn{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.03em;text-shadow:0 2px 12px rgba(0,0,0,.85)}
#tab-drops .bg{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);
    border:1px solid var(--edge);border-radius:99px;padding:2px 8px;background:rgba(13,12,11,.5)}
#tab-drops .bsub{font-family:var(--serif);font-size:15px;color:var(--ta-lite,#E0C88A);
    margin-top:4px;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.85)}
#tab-drops .be{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--dim);margin-top:3px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#tab-drops .body{padding:0 18px 10px}
#tab-drops .plainhead + .body{padding-top:4px}
#tab-drops .bnote{font-size:12.5px;color:var(--muted);line-height:1.65;margin:12px 0 6px;border-left:2px solid var(--edge);padding-left:10px}
#tab-drops .boss.shifted .bnote{border-left-color:var(--ta-soft)}
#tab-drops .modes{display:inline-flex;background:#0A0908;border:1px solid #4A3F32;border-radius:99px;
    overflow:hidden;margin:14px 0 6px;padding:2px}
#tab-drops .modes{max-width:100%}
/* 階段名太長時不換行，直接截成「…」，完整名字在標題下面那行和 tooltip */
#tab-drops .mode{background:none;border:none;color:#A79880;font-family:var(--sans);font-size:12.5px;
    font-weight:500;letter-spacing:.02em;padding:6px 12px;border-radius:99px;cursor:pointer;transition:all .15s;
    flex:0 1 auto;min-width:2.6em;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 擠不下時，先擠沒選到的，選到的那顆盡量留完整 */
#tab-drops .mode[aria-pressed="true"]{flex-shrink:.15}
#tab-drops .mode:hover{color:#fff;background:rgba(255,255,255,.07)}
#tab-drops .mode[aria-pressed="true"],#tab-drops .mode[aria-pressed="true"]:hover{
    background:var(--tc);color:#120E0A;box-shadow:0 0 14px var(--tg)}
.entry{background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:4px;
    padding:9px 11px;margin:12px 0 4px}
#tab-drops .elabel{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;
    letter-spacing:.12em;color:#E0C88A;background:rgba(201,171,110,.16);
    border:1px solid rgba(201,171,110,.38);border-radius:4px;padding:3px 10px;margin-bottom:9px}
#tab-drops .ekeys{display:flex;flex-direction:column;gap:7px}
#tab-drops .ekey{display:flex;align-items:center;gap:10px;width:100%;background:#14110F;border:1px solid #3A3128;
    border-radius:5px;padding:5px 13px 5px 6px;font-size:13.5px;color:#C6B9A3;cursor:pointer;transition:all .15s}
#tab-drops .ekey:hover{border-color:var(--curr);color:var(--bone);background:#1A1613}
.kic{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);border:1px solid #2E2720;border-radius:3px;overflow:hidden}
#tab-drops .kic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#tab-drops .kd{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--curr);opacity:.55}
#tab-drops .ekey.has .kd{background:var(--curr);opacity:1}
#tab-drops .ekey b{font-family:var(--mono);font-size:11.5px;color:var(--curr);font-weight:500;
    letter-spacing:.04em;margin-left:auto;padding-left:10px}
#tab-drops .drop{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px;border-radius:3px;
    border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .12s}
#tab-drops .drop:last-child{border-bottom:none}
#tab-drops .drop:hover{background:rgba(255,255,255,.05)}
#tab-drops .dot{width:7px;height:7px;flex-shrink:0;transform:rotate(45deg);border:1px solid var(--edge-hi);transition:all .16s}
#tab-drops .drop.has .dot{background:currentColor;border-color:currentColor}
#tab-drops .ic{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .16s}
#tab-drops .ic img{max-width:100%;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
#tab-drops .drop:hover .ic{transform:scale(1.15)}
#tab-drops .dn{flex:1;min-width:0}
#tab-drops .dn .a{font-family:var(--serif);font-size:16px;display:block;line-height:1.35;color:var(--bone)}
#tab-drops .dn .b{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim);display:block;margin-top:2px}
#tab-drops .dnote{font-size:11.5px;color:#7B7062;line-height:1.5;margin-top:3px}
#tab-drops .dbase{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.dt{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;
    border:1px solid currentColor;border-radius:3px;padding:3px 9px;flex-shrink:0;
    background:rgba(0,0,0,.4);filter:brightness(1.3);text-shadow:0 0 10px currentColor}
#tab-drops .shared{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;color:#7A6F61;
    border:1px solid #352E26;border-radius:3px;padding:2px 7px;flex-shrink:0;background:rgba(0,0,0,.25)}
#tab-drops .dhead{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;
    letter-spacing:.12em;border-radius:4px;padding:3px 10px;margin:6px 0 8px;
    color:#F0B073;background:rgba(199,124,46,.18);border:1px solid rgba(199,124,46,.42)}
#tab-drops .dhead2{color:#9FB4C4;background:rgba(120,150,175,.14);border-color:rgba(120,150,175,.34);
    margin-top:16px}
#tab-drops .dsep{height:1px;background:rgba(255,255,255,.07);margin:14px 0 0}

/* ── 巢狀掉落（pool）：預設收合，只露第一筆 ── */
#tab-drops .pool{margin:8px 0}
#tab-drops .phead{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:0 -6px 4px;
    border-radius:4px;cursor:pointer;user-select:none;
    background:rgba(201,171,110,.07);border:1px dashed rgba(201,171,110,.38);
    transition:background .14s,border-color .14s}
#tab-drops .phead:hover{background:rgba(201,171,110,.14);border-color:rgba(201,171,110,.7)}
#tab-drops .phead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tab-drops .pcar{width:0;height:0;flex-shrink:0;
    border-left:7px solid #C9A227;border-top:5px solid transparent;border-bottom:5px solid transparent;
    transition:transform .17s}
#tab-drops .pool.on .pcar{transform:rotate(90deg)}
#tab-drops .pname{font-family:var(--serif);font-size:15.5px;color:#E0C88A}
#tab-drops .ppct{font-family:var(--mono);font-size:12.5px;color:#CFC2AA;
    background:rgba(255,255,255,.05);border:1px solid #3E362D;border-radius:3px;padding:1px 8px}
#tab-drops .pmore{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#8B7F6E}
#tab-drops .phead:hover .pmore{color:#E0C88A}
#tab-drops .pbody{margin-left:6px;padding-left:12px;border-left:1px solid rgba(201,171,110,.22)}
#tab-drops .pool:not(.on) .pbody .drop:not(:first-child){display:none}
#tab-drops .pool:not(.on) .pbody .drop:first-child{opacity:.72}
#tab-drops .rate i{font-style:normal;font-size:10px;color:#8B7F6E;margin-left:6px;letter-spacing:.04em}
.rate{font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:.02em;
    padding:3px 10px;border-radius:3px;flex-shrink:0;
    background:rgba(255,255,255,.05);border:1px solid #3E362D;color:#CFC2AA}
#tab-drops .rate.unk{color:#6A6055;background:none;border:1px dashed #3A322A;font-size:11.5px;letter-spacing:.08em}

<script>
(function(){
  /* ── 要隱藏哪些分頁 ───────────────────────────────
     把名字從下面這個清單刪掉，那個分頁就會重新出現。
       drops  掉落查詢器        filter 物品過濾器
       beast  野獸查詢器        tali   魔符查詢器
       scarab 聖甲蟲            strat  刷圖策略
       math   小學數學
     程式和資料都還在，只是不顯示而已。
     全部都顯示 → 寫成 const HIDE=[];                      */
  const HIDE=["filter","beast","tali","scarab","strat","math"];

  const ALL=[["t-drops","tab-drops"],["t-filter","tab-filter"],["t-beast","tab-beast"],["t-tali","tab-tali"],["t-scarab","tab-scarab"],["t-strat","tab-strat"],["t-math","tab-math"]];
  const key=p=>p.replace("tab-","");
  const tabs=ALL.filter(([b,p])=>!HIDE.includes(key(p)));

  /* 被藏起來的：按鈕和內容都收掉 */
  ALL.forEach(([b,p])=>{
    if(tabs.some(t=>t[1]===p)) return;
    const btn=document.getElementById(b), panel=document.getElementById(p);
    if(btn) btn.hidden=true;
    if(panel) panel.hidden=true;
  });
  /* 只剩一個分頁的話，整排按鈕也沒意義了 */
  if(tabs.length<2){
    const bar=document.querySelector(".tabs");
    if(bar) bar.hidden=true;
  }

  function go(id){
    tabs.forEach(([b,p])=>{
      const on=p===id;
      document.getElementById(b).setAttribute("aria-selected",on);
      document.getElementById(p).hidden=!on;
    });
    try{ location.hash = key(id); }catch(e){}
  }
  tabs.forEach(([b,p])=>document.getElementById(b).onclick=()=>go(p));

  if(tabs.length){
    const h=location.hash.slice(1);
    const want=tabs.find(([b,p])=>key(p)===h);
    go(want ? want[1] : tabs[0][1]);
  }
})();
</script>
<script>
(function(){

/* 物品類型 → 顏色。想加新類型直接往下加一行就好。
   打了對照表裡沒有的字會顯示灰色，方便發現拼錯。 */
const TYPES={
  "傳奇":"#D08A38",          // 橘
  "稀有":"#E8DB6A",          // 黃
  "魔法":"#8A8AFF",          // 藍
  "普通":"#C8C8C8",          // 白

  "通貨":"#D2B478",          // 金
  "碎片":"#A89777",          // 暗金

  "技能":"#2FB8AE",          // 青綠（寶石）
  "寶石":"#2FB8AE",
  "輔助":"#2FB8AE",

  "命運卡":"#7FB4DC",        // 淡藍
  "卡片":"#7FB4DC",

  "珠寶":"#A97BD6",          // 紫
  "任務":"#5BC83F",          // 亮綠
  "地圖":"#C9A227",          // 土黃
  "屍體":"#9A6B5A",          // 褐（腐屍工作台）
  "野獸":"#5FA86B",          // 草綠
  "一般":"#C8C8C8",          // 同「普通」
};
const TYPE_FALLBACK="#8B7F6E";   // 認不得的類型
/* 依序嘗試的副檔名。順序很重要：猜錯一次就是一次 404，線上版會明顯變慢。
   img/item/ 幾乎都是 .png，img/icon/ 幾乎都是 .webp，所以兩邊用不同順序。
   以後主要存檔格式變了，改這兩行就好。 */
const EXT      =[".png",".jpg",".jpeg",".webp"];   // img/item/ 用（提示框截圖）
const EXT_ICON =[".webp",".png",".jpg",".jpeg"];   // img/icon/ 用（小圖示）

/* 圖片清單（img/manifest.js，由上傳網站.bat 自動產生）。
   查得到就直接知道檔名，一次請求就拿到圖；查不到（剛加還沒重跑 bat）
   就退回原本「依序試副檔名」的做法，所以清單過期也不會壞。 */
function mapUrl(dir,name){
  const M=(typeof IMG_MAP!=="undefined" && IMG_MAP) ? IMG_MAP : null;   // 每次現查，載入順序怎樣都不會漏
  const t=M && M[dir];
  if(!t) return null;
  const ext=t[name];
  return ext ? "img/"+dir+"/"+encodeURIComponent(name+"."+ext) : null;
}

const wall=document.getElementById("wall"), groupBar=document.getElementById("groups");
const tally=document.getElementById("tally"), q=document.getElementById("q");
const toast=document.getElementById("toast"), veil=document.getElementById("veil"), sheet=document.getElementById("sheet");
const peek=document.getElementById("peek"), peekImg=peek.querySelector("img");

let filter="全部";
const openPools=new Set();   // 展開中的 pool，key = 頭目索引|pool 名
const show={rate:true,dust:false};   // 第二行開關的預設值
const modeOf={};
const pinned={};   // 使用者手動點過階段的卡片，不再被搜尋自動切走
const cardCache={};      // 提示框截圖：物品名 → 網址 或 null
const iconCache={};      // 小圖示：物品名 → 網址 或 null

const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function hit(text,term){
  const t=esc(text||"");
  if(!term) return t;
  const i=t.toLowerCase().indexOf(term);
  return i<0?t:t.slice(0,i)+"<em>"+t.slice(i,i+term.length)+"</em>"+t.slice(i+term.length);
}
/* ---------- 階段 ---------- */
const ALIAS={normal:"一般",uber:"究極"};

/* 頭目有哪些階段。新寫法 tiers，舊寫法 uber:true 也支援 */
function tiersOf(b){
  if(Array.isArray(b.tiers)&&b.tiers.length){
    const out=b.tiers.filter(t=>t!=null&&t!=="")
      .map(t=>typeof t==="string"?{key:t,title:null}:{key:t.name||"?",title:t.title||null});
    if(out.length) return out;
  }
  if(b.uber) return [{key:"一般",title:b.name},{key:"究極",title:b.uberName||"究極"+(b.name||"")}];
  return [{key:"一般",title:b.name}];
}

/* 這筆資料屬於哪些階段。沒寫 = 全部階段 */
function onTiers(d){
  let v=d.only;
  if(v==null||v==="") return null;
  if(!Array.isArray(v)) v=[v];
  return v.map(x=>ALIAS[x]||x);
}
const visible=(d,tier)=>{ const t=onTiers(d); return !t||t.includes(tier); };

/* 顏色：第一階段橘，最後一階段紅，中間自動內插 */
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const A=hex("#C77C2E"), B=hex("#C2503F");
function tierColor(i,n){
  if(n<=1||i<=0) return {c:"#C77C2E",g:"rgba(199,124,46,.35)",soft:"rgba(199,124,46,.45)",lite:"#E8B37A"};
  const k=i/(n-1), m=A.map((v,j)=>Math.round(v+(B[j]-v)*k));
  const rgb=m.join(",");
  const lite=m.map(v=>Math.min(255,Math.round(v+(255-v)*0.42))).join(",");
  return {c:`rgb(${rgb})`, g:`rgba(${rgb},.38)`, soft:`rgba(${rgb},.5)`, lite:`rgb(${lite})`};
}
const dtext=d=>[d.name,d.en,d.base,d.note].filter(Boolean).join(" ").toLowerCase();
/* 從遊戲或網頁複製常夾帶零寬字元，肉眼看不到但檔名會對不上，查圖前先濾掉 */
const zw=s=>String(s??"").replace(/[​-‍⁠﻿]/g,"").trim();
const keyOf=d=>zw(d.card||d.name||d.en);

/* 依序試副檔名，找到就記住 */
function findCard(d){
  const key=keyOf(d);
  if(!key) return Promise.resolve(null);
  if(key in cardCache) return Promise.resolve(cardCache[key]);

  if(!d.card){
    const hit=mapUrl("item",key);
    if(hit){ cardCache[key]=hit; return Promise.resolve(hit); }
  }
  const bases=d.card ? [zw(d.card)] : EXT.map(e=>key+e);
  return new Promise(res=>{
    let i=0;
    const next=()=>{
      if(i>=bases.length){ cardCache[key]=null; return res(null); }
      const url="img/item/"+encodeURIComponent(bases[i++]);
      const im=new Image();
      im.onload=()=>{ cardCache[key]=url; res(url); };
      im.onerror=next;
      im.src=url;
    };
    next();
  });
}

/* 小圖示：img/icon/中文名.png，依序試副檔名 */
function findIcon(d){
  const key=zw(d.icon||d.name||d.en);
  if(!key) return Promise.resolve(null);
  if(key in iconCache) return Promise.resolve(iconCache[key]);

  if(!d.icon){
    const hit=mapUrl("icon",key);
    if(hit){ iconCache[key]=hit; return Promise.resolve(hit); }
  }
  const bases=d.icon?[key]:EXT_ICON.map(e=>key+e);
  return new Promise(res=>{
    let i=0;
    const next=()=>{
      if(i>=bases.length){ iconCache[key]=null; return res(null); }
      const url="img/icon/"+encodeURIComponent(bases[i++]);
      const im=new Image();
      im.onload=()=>{ iconCache[key]=url; res(url); };
      im.onerror=next;
      im.src=url;
    };
    next();
  });
}

/* 掃一輪目前畫面上的物品，抓到圖就重畫一次。
   先用清單把查得到的一次補完（不碰網路，立刻就有圖），
   清單裡沒有的才去試副檔名，慢慢補上來，不會卡住前面那一批。 */
async function warmIcons(list){
  const items=list.flatMap(b=>[...(b.entry||[]),...b.drops]);

  let filled=0;
  items.forEach(d=>{
    if(d.icon) return;
    const key=zw(d.icon||d.name||d.en);
    if(!key || key in iconCache) return;
    const hit=mapUrl("icon",key);
    if(hit){ iconCache[key]=hit; filled++; }
  });
  if(filled) paint();

  const before=Object.keys(iconCache).length;
  await Promise.all(items.map(findIcon));
  if(Object.keys(iconCache).length!==before) paint();
}

/* 把 "1/500"、"0.3%"、"25%" 換算成小數，看不懂就回 null */
function parseRate(str){
  const s=String(str).replace(/[\s,]/g,"");
  let m=s.match(/^1\/(\d+(?:\.\d+)?)$/);
  if(m) return 1/parseFloat(m[1]);
  m=s.match(/^(\d+(?:\.\d+)?)%$/);
  if(m) return parseFloat(m[1])/100;
  m=s.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  return null;
}

/* pool:"罈 9%" → { label:"罈", pct:9 }。沒寫 % 就只分組、不換算 */
function poolInfo(p){
  const s=String(p??"").trim();
  if(!s) return null;
  const m=s.match(/^(.*?)\s*([\d.]+)\s*%\s*$/);
  return m ? { label:m[1].trim()||s, pct:parseFloat(m[2]) } : { label:s, pct:null };
}
/* 巢狀機率：pool 9% × 自己 28% = 2.5% */
function absRate(d){
  const pi=poolInfo(d.pool); if(!pi||pi.pct==null) return null;
  const m=String(d.rate??"").match(/([\d.]+)\s*%/); if(!m) return null;
  const v=pi.pct*parseFloat(m[1])/100;
  return v<0.1 ? v.toFixed(2).replace(/0+$/,"").replace(/\.$/,"") : (Math.round(v*10)/10);
}

function rateTag(d){
  const raw=(d.rate==null?"":String(d.rate)).trim();
  if(!raw) return "";                                   // 沒填 = 還沒查
  if(raw==="?"||raw==="未公開") return `<span class="rate unk">未公開</span>`;
  const abs=absRate(d);
  if(abs!=null) return `<span class="rate" title="${esc(d.pool)} 中的 ${esc(raw)}">${abs}%<i>${esc(raw)}</i></span>`;
  return `<span class="rate">${esc(raw)}</span>`;
}

function matches(b,term){
  if(!term) return true;
  const head=[b.name,b.en,b.note,b.uberName,...tiersOf(b).map(t=>t.title)]
    .filter(Boolean).join(" ").toLowerCase();
  return head.includes(term)
    || b.drops.some(d=>dtext(d).includes(term))
    || (b.entry||[]).some(k=>dtext(k).includes(term));
}

/* 掉落列和碎片標籤共用同一套查找 */
function itemOf(el){
  const b=BOSSES[+el.dataset.b];
  if(!b) return null;
  const item = "e" in el.dataset ? (b.entry||[])[+el.dataset.e] : b.drops[+el.dataset.d];
  return item ? {b,d:item} : null;
}
function effectiveTier(b,term){
  const ts=tiersOf(b), keys=ts.map(t=>t.key);
  let cur=modeOf[b.en||b.name];
  if(!keys.includes(cur)) cur=keys[0];
  if(term&&keys.length>1&&!pinned[b.en||b.name]){
    const all=[...(b.entry||[]),...b.drops];
    if(!all.some(d=>visible(d,cur)&&dtext(d).includes(term))){
      const found=keys.find(k=>all.some(d=>visible(d,k)&&dtext(d).includes(term)));
      if(found) return found;
    }
  }
  return cur;
}

function fmtDust(v){
  if(v==null||v==="") return "";
  const n=typeof v==="number"?v:Number(String(v).replace(/[,\s]/g,""));
  if(!isFinite(n)) return String(v);                       // 不是數字就原樣顯示
  if(n>=1000000) return (n/1000000).toFixed(2).replace(/\.?0+$/,"")+"M";
  return n.toLocaleString("en-US");                        // 123,555
}
function dustTier(v){
  const n=typeof v==="number"?v:Number(String(v).replace(/[,\s]/g,""));
  if(!isFinite(n)) return "d1";
  return n>=1000000?"d3":n>=100000?"d2":"d1";
}
/* 粉塵查找：先看資料自己有沒有寫，再查 dust.js 對照表（中文名優先，再試英文名） */
const DUSTDB = (typeof DUST!=="undefined") ? DUST : {};
function dustOf(d){
  if(d.dust!=null && d.dust!=="") return d.dust;
  if(d.name && DUSTDB[d.name]!=null) return DUSTDB[d.name];
  if(d.en   && DUSTDB[d.en]  !=null) return DUSTDB[d.en];
  return null;
}
const anyDust=()=>BOSSES.some(b=>(b.drops||[]).some(d=>dustOf(d)!=null));

function buildToggles(){
  const bar=document.getElementById("toggles");
  const opts=[["rate","掉落機率"]];
  if(anyDust()) opts.push(["dust","奇術魔塵"]);
  bar.innerHTML=`<span class="tlabel">顯示</span>`;
  opts.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.className="tog"; b.textContent=label;
    b.dataset.k=k;
    b.setAttribute("aria-pressed",show[k]);
    b.onclick=()=>{ show[k]=!show[k]; buildToggles(); render(); };
    bar.appendChild(b);
  });
}

function buildGroups(){
  const gs=["全部",...new Set(BOSSES.map(b=>b.group).filter(Boolean))];
  groupBar.innerHTML="";
  gs.forEach(g=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=g;
    b.setAttribute("aria-pressed",filter===g);
    b.onclick=()=>{filter=g;buildGroups();render();};
    groupBar.appendChild(b);
  });
}

function card(b,term,i){
  if(!Array.isArray(b.drops)) b.drops=[];
  if(b.entry&&!Array.isArray(b.entry)) b.entry=[];
  const key=b.en||b.name;
  const ts=tiersOf(b), n=ts.length;
  const tier=effectiveTier(b,term);
  const ti=Math.max(0,ts.findIndex(t=>t.key===tier));
  const col=tierColor(ti,n);
  const shifted=ti>0;

  /* 標題規則：
     tier 的 title 裡含 b.name（例如「釋界」→「終極釋界」）→ 照舊，title 當大標題。
     不含（例如「戰亂之殤(v3.7)」→「穆希爾斯．獅眼將軍」）→ b.name 當大標題，
     tier 的 title 降成底下的小字。聯盟名才不會被王名蓋掉。 */
  const tTitle=ts[ti].title||"";
  const tierIsMain=!!tTitle && !!b.name && tTitle.includes(b.name);
  const title=tierIsMain ? tTitle : (b.name||b.en);
  /* 按鈕會被截斷，所以目前選到的階段一定要在標題下面完整寫一次 */
  const tKey=ts[ti].key||"";
  let sub=(!tierIsMain && tTitle) ? tTitle : "";
  if(!sub && n>1 && tKey && tKey!=="一般" && !String(title||"").includes(tKey)) sub=tKey;
  const head=`<div class="bh"><span class="bn">${hit(title||b.en,term)}</span>
      ${b.group?`<span class="bg">${esc(b.group)}</span>`:""}</div>
    ${sub?`<div class="bsub">${hit(sub,term)}</div>`:""}
    ${b.name&&b.en?`<div class="be">${hit(b.en,term)}</div>`:""}`;
  const header=b.img
    ? `<div class="hero" style="background-image:url('img/boss/${encodeURI(b.img)}')"><div class="htxt">${head}</div></div>`
    : `<div class="plainhead">${head}</div>`;

  const toggle = n>1 ? `<div class="modes" data-key="${esc(key)}">${
    ts.map((t,x)=>{
      const c=tierColor(x,n);
      return `<button class="mode" data-m="${esc(t.key)}" aria-pressed="${t.key===tier}"
        title="${esc(t.key)}" style="--tc:${c.c};--tg:${c.g}">${esc(t.key)}</button>`;
    }).join("")}</div>` : "";

  const bi=BOSSES.indexOf(b);

  /* 只有多階段的王才標；共有的掉落標「共有」，限定的不標 */
  const badge=()=>"";   // 改用分組標題，不再逐列標記

  const keys=(b.entry||[]).filter(k=>visible(k,tier));
  const entry=keys.length?`<div class="entry">
      <span class="elabel">入場需求</span>
      <div class="ekeys">${keys.map(k=>{
        const kn=k.name||k.en;
        const kic=iconCache[zw(k.icon||k.name||k.en)];
        return `<span class="ekey ${cardCache[keyOf(k)]?"has":""}" data-b="${bi}" data-e="${b.entry.indexOf(k)}">
          <span class="kic">${kic?`<img src="${kic}" alt="" loading="lazy" decoding="async">`:`<span class="kd"></span>`}</span><span class="kn">${hit(kn,term)}</span>${k.count?`<b>×${esc(k.count)}</b>`:""}</span>`;
      }).join("")}</div>
    </div>`:"";

  const vis=b.drops.map((d,di)=>({d,di})).filter(({d})=>visible(d,tier));
  /* 出現在幾個階段：1 = 本階限定，n = 全階段共有 */
  const span=x=>{ const t=onTiers(x.d); return t?t.length:n; };
  const excl=vis.filter(x=>span(x)===1), rest=vis.filter(x=>span(x)>1);
  rest.sort((a,b2)=>span(a)-span(b2));                 // 跨越越多階段的排越後面
  /* 只要有「限定」的掉落就標題。單階段的王全部都算限定，所以每張卡都會有標籤，看起來一致。
     「共同掉落」那顆只有在真的有共同掉落時才長出來（單階段永遠沒有）。
     想改文字就改下面這兩個字串。 */
  const HEAD_EXCL="獨特掉落物", HEAD_REST="共同掉落";
  const split=(excl.length>0);

  const row=({d,di})=>{
    const main=d.name||d.en, second=(d.name&&d.en)?d.en:"";
    const color=TYPES[d.type]||TYPE_FALLBACK;
    const ic=iconCache[zw(d.icon||d.name||d.en)];
    return `<div class="drop ${cardCache[keyOf(d)]?"has":""}" data-b="${bi}" data-d="${di}" style="color:${color}">
      ${ic?`<span class="ic"><img src="${ic}" alt="" loading="lazy" decoding="async"></span>`:`<span class="dot"></span>`}
      <span class="dn"><span class="a">${hit(main,term)}</span>
        ${second?`<span class="b">${hit(second,term)}</span>`:""}
        ${d.note?`<span class="dnote">${hit(d.note,term)}</span>`:""}</span>
      ${d.base?`<span class="dbase">${esc(d.base)}</span>`:""}
      ${badge(d)}
      ${show.rate?rateTag(d):""}
      ${(()=>{ if(!show.dust) return "";
        const v=dustOf(d); if(v==null) return "";
        const own=d.dust!=null&&d.dust!=="";
        return `<span class="dust ${dustTier(v)}" title="${own?"這筆資料自訂":"來自 dust.js 對照表"}">${esc(fmtDust(v))}</span>`;
      })()}
      <span class="dt">${esc(d.type||"傳奇")}</span>
    </div>`;
  };

  /* pool 群組：收合時只露第一筆，點標題展開。搜尋命中會自動展開。 */
  const poolBlock=g=>{
    const pi=poolInfo(g.name)||{label:g.name,pct:null};
    const id=bi+"|"+g.name;
    const hitIn=!!term&&g.items.some(x=>dtext(x.d).includes(term));
    const open=openPools.has(id)||hitIn;
    const more=g.items.length-1;
    return `<div class="pool ${open?"on":""}" data-pool="${esc(id)}">
      <div class="phead" role="button" tabindex="0" aria-expanded="${open}">
        <span class="pcar"></span>
        <span class="pname">${hit(pi.label,term)}</span>
        ${pi.pct!=null?`<span class="ppct">${pi.pct}%</span>`:""}
        <span class="pmore">${open?`共 ${g.items.length} 項`:(more>0?`點開看其餘 ${more} 項`:`共 ${g.items.length} 項`)}</span>
      </div>
      <div class="pbody">${g.items.map(row).join("")}</div>
    </div>`;
  };

  /* 把有 pool 的收成群組，位置照第一次出現的順序 */
  const seg=list=>{
    const out=[], map=new Map();
    list.forEach(x=>{
      const p=x.d.pool;
      if(!p){ out.push({one:x}); return; }
      if(!map.has(p)){ const g={name:p,items:[]}; map.set(p,g); out.push({grp:g}); }
      map.get(p).items.push(x);
    });
    return out.map(e=>e.one?row(e.one):poolBlock(e.grp)).join("");
  };

  const rows = split
    ? `<div class="dhead">${HEAD_EXCL}</div>${seg(excl)}`
      + (rest.length ? `<div class="dsep"></div><div class="dhead dhead2">${HEAD_REST}</div>${seg(rest)}` : "")
    : seg(vis);

  return `<section class="boss ${shifted?"shifted":""}"
      style="animation-delay:${Math.min(i,12)*30}ms;--ta:${col.c};--ta-soft:${col.soft};--ta-glow:${col.g};--ta-lite:${col.lite}">
    ${header}
    <div class="body">
      ${b.note?`<div class="bnote">${hit(b.note,term)}</div>`:""}
      ${toggle}
      ${entry}
      ${rows|| (b.note||b.link ? "" : `<div class="bnote">這個階段沒有專屬掉落。</div>`)}
      ${b.link?`<a class="blink" href="${esc(b.link)}" target="_blank" rel="noopener">參考連結</a>`:""}
    </div></section>`;
}

/* 一列放幾張卡。"auto" = 照畫面寬度算，卡片最小 MIN_CARD。存 localStorage，重開還在。 */
const COLS_KEY="poe-tool/cols";
const MIN_CARD=340, CARD_GAP=16;
const colsInput=document.getElementById("cols");
let colsMode=(()=>{
  try{
    const raw=localStorage.getItem(COLS_KEY);
    if(raw===null) return "auto";
    const v=+raw;
    return (v>=1&&v<=6) ? String(v) : "auto";
  }catch(e){ return "auto"; }
})();
colsInput.value=colsMode;
/* 自動時量 #wall 實際能用的寬度，算得下幾張就放幾張 */
function autoCols(){
  const w=(wall&&wall.clientWidth)||document.documentElement.clientWidth||1200;
  return Math.max(1,Math.min(8,Math.floor((w+CARD_GAP)/(MIN_CARD+CARD_GAP))));
}
function colCount(){ return colsMode==="auto" ? autoCols() : +colsMode; }
colsInput.addEventListener("change",()=>{
  colsMode=colsInput.value==="auto" ? "auto" : String(Math.max(1,Math.min(6,+colsInput.value||3)));
  try{ localStorage.setItem(COLS_KEY,colsMode); }catch(e){}
  openRows.clear(); render();
});
/* 視窗寬度變了就重算，欄數真的有變才重畫 */
let lastAuto=null, resizeT=null;
addEventListener("resize",()=>{
  if(colsMode!=="auto") return;
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    const n=autoCols();
    if(n!==lastAuto){ openRows.clear(); render(); }
  },160);
});
const openRows=new Set();          // 展開中的列

/* 滿版開關。跟欄數一樣存 localStorage，重開還在。 */
const WIDE_KEY="poe-tool/wide";
const wideBtn=document.getElementById("wide");
function setWide(on){
  document.body.classList.toggle("wide",on);
  wideBtn.setAttribute("aria-pressed",on);
  try{ localStorage.setItem(WIDE_KEY,on?"1":"0"); }catch(e){}
}
/* 沒設定過就預設開啟：寬螢幕直接拉滿，不用自己去按 */
try{ setWide(localStorage.getItem(WIDE_KEY)!=="0"); }catch(e){ setWide(true); }
wideBtn.addEventListener("click",()=>setWide(!document.body.classList.contains("wide")));

/* 這隻王在目前階段看得到幾筆掉落 */
function dropCount(b,term){
  const tier=effectiveTier(b,term);
  return (b.drops||[]).filter(d=>visible(d,tier)).length;
}

function paint(){
  const term=q.value.trim().toLowerCase();
  const list=BOSSES.filter(b=>(filter==="全部"||b.group===filter)&&matches(b,term));
  tally.innerHTML=`<b>${list.length}</b> 個頭目 · <b>${list.reduce((s,b)=>s+((b.drops&&b.drops.length)||0),0)}</b> 筆掉落`;
  const one=(b,i)=>{
    try{ return card(b,term,i); }
    catch(err){
      console.error("這個頭目的資料有問題：", b?.name||b?.en||`第 ${i+1} 筆`, err);
      return `<section class="boss" style="border-color:#8A4034">
        <div class="plainhead"><div class="bh"><span class="bn" style="color:#D97A66">${
          esc(b?.name||b?.en||"（無名稱）")}</span></div></div>
        <div class="body"><div class="bnote" style="border-left-color:#8A4034;color:#C4877A">
          這筆資料格式有問題，其他卡片不受影響。<br>按 F12 看 Console 有詳細訊息。<br>
          <span style="font-family:var(--mono);font-size:11px;opacity:.8">${esc(String(err.message||err))}</span>
        </div></div></section>`;
    }
  };

  /* 依欄數切成一列一列，太長的列預設收起來，點橫幅展開 */
  const CAP_ROWS=10;
  const cols=colCount();
  lastAuto=cols;
  const groups=[];
  for(let i=0;i<list.length;i+=cols) groups.push({at:i,items:list.slice(i,i+cols)});

  wall.innerHTML=list.length
    ? groups.map(g=>{
        const counts=g.items.map(b=>dropCount(b,term));
        const tall=Math.max(0,...counts)>CAP_ROWS;
        const id="r"+g.at;
        const open=openRows.has(id)||!!term;      // 有搜尋字就全開，免得結果被藏住
        const chips=g.items.map(b=>`<span class="rchip">${esc(b.name||b.en||"")}</span>`).join("");
        const bar = tall ? `<div class="rowbar" role="button" tabindex="0" aria-expanded="${open}">
            <span class="rcar"></span>
            <span class="rnames">${chips}</span>
            <span class="rmore">${open?"收合":"展開"}</span>
          </div>` : "";
        return `<div class="rowgrp ${tall?"cap":""} ${open?"on":""}" data-row="${id}">
          ${bar}
          <div class="rowcards" style="--cols:${cols}">${
            g.items.map((b,k)=>one(b,g.at+k)).join("")}</div>
        </div>`;
      }).join("")
    : `<div class="none">沒有符合的資料。<br>換個關鍵字，或到 <code>data.js</code> 把它加進去。</div>`;
  return list;
}

function render(){ warmIcons(paint()); }

/* ---------- 滑鼠停留預覽 ---------- */
let hoverTimer=null, hoverRow=null;

function placePeek(x,y){
  const w=peek.offsetWidth||520, h=peek.offsetHeight||420;
  let L=x+20, T=y+16;
  if(L+w>innerWidth-12)  L=x-w-20;
  if(T+h>innerHeight-12) T=Math.max(12,innerHeight-h-12);
  peek.style.left=L+"px"; peek.style.top=T+"px";
}

wall.addEventListener("mouseover",e=>{
  const row=e.target.closest(".drop,.ekey");
  if(!row||row===hoverRow) return;
  hoverRow=row;
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(async()=>{
    const found=itemOf(row);
    if(!found) return;
    const url=await findCard(found.d);
    if(hoverRow!==row) return;
    if(!url) return;
    row.classList.add("has");
    peekImg.src=url;
    peekImg.onload=()=>{ placePeek(lastX,lastY); peek.classList.add("on"); };
    if(peekImg.complete){ placePeek(lastX,lastY); peek.classList.add("on"); }
  },140);
});
wall.addEventListener("mouseout",e=>{
  if(e.target.closest(".drop,.ekey")&&!e.relatedTarget?.closest?.(".drop,.ekey")){
    clearTimeout(hoverTimer); hoverRow=null; peek.classList.remove("on");
  }
});
let lastX=0,lastY=0;
addEventListener("mousemove",e=>{
  lastX=e.clientX; lastY=e.clientY;
  if(peek.classList.contains("on")) placePeek(lastX,lastY);
});

/* ---------- 點擊放大 ---------- */
/* 變體：variants:["火焰","冰冷"] → 找 img/item/名稱_火焰.png */
function variantsOf(d){
  if(!Array.isArray(d.variants)||!d.variants.length) return null;
  const base=zw(d.name||d.en);
  return d.variants.map(v=>typeof v==="string"
    ? {label:v, item:{name:`${base}_${v}`}}
    : {label:v.name||v.label||"", item:{name:v.file||`${base}_${v.name||v.label}`,
       card:v.card, icon:v.icon}});
}

async function openItem(b,d){
  peek.classList.remove("on");
  const main=d.name||d.en;
  const t=onTiers(d), ts=tiersOf(b);
  const hitT=t?ts.find(x=>t.includes(x.key)):null;
  const who=(hitT?.title)||b.name||b.en;
  const isKey=(b.entry||[]).includes(d);
  const from=isKey?`${esc(who)} 的入場需求`:`掉落自 ${esc(who)}`;
  const vars=variantsOf(d);
  let url,ico,vIcons=[],vCards=[];

  if(vars){
    [vIcons,vCards]=await Promise.all([
      Promise.all(vars.map(v=>findIcon(v.item))),
      Promise.all(vars.map(v=>findCard(v.item))),
    ]);
    const first=vCards.findIndex(x=>x);          // 第一個有截圖的當預設
    url=vCards[first>=0?first:0]||await findCard(d);
    d._vi=first>=0?first:0;
  }else{
    [url,ico]=await Promise.all([findCard(d),findIcon(d)]);
  }

  const left = vars
    ? `<div class="vlist">${vars.map((v,i)=>`
        <button class="vico" data-v="${i}" aria-pressed="${i===d._vi}" title="${esc(v.label)}">
          ${vIcons[i]?`<img src="${vIcons[i]}" alt="">`:`<span style="opacity:.35">?</span>`}
          <span class="vt">${esc(v.label)}</span>
        </button>`).join("")}</div>`
    : (ico?`<div class="dico"><img src="${ico}" alt=""></div>`:"");

  sheet.innerHTML=`
    <div class="dlg">
      ${left}
      ${url ? `<img class="shot" src="${url}" alt="${esc(main)}">`
            : `<div class="nocard"><strong>${esc(main)}</strong><br>
               還沒有這個物品的截圖。<br>
               存成 <code>img\\item\\${esc(main)}.png</code> 就會自動出現。</div>`}
    </div>
    ${d.note?`<div class="from" style="color:#8B7F6E">${esc(d.note)}</div>`:""}
    <div class="from">${from}${(d.rate!=null&&String(d.rate).trim())
        ? ` · 機率 ${esc(String(d.rate).trim()==="?"?"未公開":d.rate)}` : ""}</div>
    <div class="acts">
      <button class="act pri" data-copy="${esc(main)}">複製名稱</button>
      ${(d.name&&d.en)?`<button class="act" data-copy="${esc(d.en)}">複製英文</button>`:""}
      <button class="act" data-close="1">關閉</button>
    </div>`;
  veil.classList.add("on");
  sheet._vars=vars; sheet._vCards=vCards;

  /* 左邊圖示高度 = 截圖高度的一半（想改比例就動 /2） */
  const dico=sheet.querySelector(".dico"), shot=sheet.querySelector(".shot");
  if(dico){
    const fit=()=>{ const h=shot?.clientHeight||0; if(h) dico.style.height=(h/2)+"px"; };
    if(shot&&!shot.complete) shot.addEventListener("load",fit,{once:true});
    fit();
  }
}
const closeItem=()=>veil.classList.remove("on");

function copy(t){
  navigator.clipboard?.writeText(t).then(()=>{
    toast.textContent=`已複製「${t}」`;
    toast.classList.add("on");
    clearTimeout(window._tt);
    window._tt=setTimeout(()=>toast.classList.remove("on"),1600);
  }).catch(()=>{});
}

function togglePool(ph){
  const box=ph.parentNode, id=box.dataset.pool;
  const on=!box.classList.contains("on");
  if(on) openPools.add(id); else openPools.delete(id);
  box.classList.toggle("on",on);
  ph.setAttribute("aria-expanded",on);
  const n=box.querySelectorAll(".pbody .drop").length;
  const m=ph.querySelector(".pmore");
  if(m) m.textContent = on ? `共 ${n} 項` : (n>1?`點開看其餘 ${n-1} 項`:`共 ${n} 項`);
}

function toggleRow(bar){
  const box=bar.parentNode, id=box.dataset.row;
  const on=!box.classList.contains("on");
  if(on) openRows.add(id); else openRows.delete(id);
  box.classList.toggle("on",on);
  bar.setAttribute("aria-expanded",on);
  const m=bar.querySelector(".rmore");
  if(m) m.textContent = on ? "收合" : "展開";
  if(!on) box.scrollIntoView?.({block:"nearest"});
}

wall.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const rb=e.target.closest?.(".rowbar");
  if(rb){ e.preventDefault(); return toggleRow(rb); }
  const ph=e.target.closest?.(".phead"); if(!ph) return;
  e.preventDefault(); togglePool(ph);
});

wall.addEventListener("click",e=>{
  const rb=e.target.closest(".rowbar");
  if(rb){ toggleRow(rb); return; }
  const ph=e.target.closest(".phead");
  if(ph){ togglePool(ph); return; }
  const btn=e.target.closest(".mode");
  if(btn){
    const k=btn.parentNode.dataset.key;
    modeOf[k]=btn.dataset.m; pinned[k]=true;    // 手動選擇優先
    render(); return;
  }
  const row=e.target.closest(".drop,.ekey");
  if(!row) return;
  const found=itemOf(row);
  if(found) openItem(found.b,found.d);
});

veil.addEventListener("click",e=>{
  const v=e.target.closest(".vico");
  if(v){
    const i=+v.dataset.v, shot=sheet.querySelector(".shot");
    if(shot&&sheet._vCards?.[i]) shot.src=sheet._vCards[i];
    sheet.querySelectorAll(".vico").forEach(x=>x.setAttribute("aria-pressed",x===v));
    return;
  }
  const c=e.target.closest("[data-copy]");
  if(c){ copy(c.dataset.copy); return; }
  if(e.target.closest("[data-close]")||e.target===veil||e.target===sheet) closeItem();
});

addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(veil.classList.contains("on")) return closeItem();
    if(document.activeElement===q){ q.value=""; q.blur(); render(); }
  }
  if(e.key==="/"&&document.activeElement!==q&&!veil.classList.contains("on")){ e.preventDefault(); q.focus(); }
});
q.addEventListener("input",()=>{
  for(const k in pinned) delete pinned[k];      // 換關鍵字 → 自動切換恢復
  render();
});

if(typeof BOSSES==="undefined"){
  wall.innerHTML=`<div class="none"><strong>找不到 data.js</strong><br>它要跟這個網頁放在同一個資料夾。</div>`;
}else{ buildGroups(); buildToggles(); render(); }

})();
</script>

  Yellow:"#E8DB4C",Cyan:"#4CD6D6",Grey:"#9E9E9E",Orange:"#E0842A",Pink:"#E87FBF",Purple:"#A96FD0"};

const rgba=s=>{
  const n=s.trim().split(/\s+/).map(Number);
  const a=n.length>3?(n[3]/255):1;
  return `rgba(${n[0]||0},${n[1]||0},${n[2]||0},${a})`;
};

function parse(text){
  const out=[]; let cur=null;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();
    if(!line) continue;
    const m=line.match(/^(Show|Hide)\b(.*)$/);
    if(m){
      if(cur) out.push(cur);
      const c=m[2].indexOf("#");
      cur={act:m[1], name:(c>=0?m[2].slice(c+1):"").trim(), conds:[], style:{}, extras:[], raw:[]};
      continue;
    }
    if(!cur) continue;
    cur.raw.push(raw.replace(/\s+$/,""));
    if(line.startsWith("#")) continue;
    const key=line.split(/\s+/)[0];
    const rest=line.slice(key.length).trim();
    if(key==="SetTextColor")            cur.style.text=rgba(rest);
    else if(key==="SetBackgroundColor") cur.style.bg=rgba(rest);
    else if(key==="SetBorderColor")     cur.style.border=rgba(rest);
    else if(key==="SetFontSize")        cur.style.size=parseInt(rest)||32;
    else if(key==="MinimapIcon"){ const p=rest.split(/\s+/);
      cur.style.icon={size:+p[0]||0,color:p[1],shape:p[2]}; }
    else if(key==="PlayEffect"){ const p=rest.split(/\s+/);
      cur.style.beam=p[0]; cur.style.beamTemp=/Temp/i.test(rest); }
    else if(key==="CustomAlertSound") cur.extras.push(["自訂音效",rest.replace(/"/g,"").split(/[\\/]/).pop()]);
    else if(key==="PlayAlertSound")   cur.extras.push(["內建音效",rest]);
    else if(key==="DisableDropSound") cur.extras.push(["掉落音","關閉"]);
    else if(COND.includes(key))       cur.conds.push({k:key,v:rest});
  }
  if(cur) out.push(cur);
  return out;
}

/* ---- 英文名 → 中文 ---- */
const T = (typeof TERMS!=="undefined") ? TERMS : {};
const quoted = v => {
  const m = v.match(/"([^"]+)"/g);
  return m ? m.map(x=>x.slice(1,-1)) : [v.replace(/^==?\s*/,"").trim()].filter(Boolean);
};
function nameOf(r){
  const bt=r.conds.find(c=>c.k==="BaseType");
  const cl=r.conds.find(c=>c.k==="Class");
  const src=bt||cl;
  if(!src) return {en:null, zh:null, extra:0,
    fallback:(r.name.split(/\s*-\s*/).pop()||"（無條件）").trim()};
  const list=quoted(src.v);
  const en=list[0]||"";
  return {en, zh:T[en]||null, extra:Math.max(0,list.length-1), fallback:null};
}

/* ================= 狀態 ================= */
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
let RULES=[], cat="全部", sub=null, showS=true, showH=true, open=new Set();
let lang="zh", cols=1;

const catOf=n=>{ const p=n.split(/\s*-\s*/); return (p[0]||"").trim()||"未分類"; };
const subOf=n=>{ const p=n.split(/\s*-\s*/); return (p[1]||"").trim()||"其他"; };

const $=id=>document.getElementById(id);

function matches(r,term){
  if(r.act==="Show"&&!showS) return false;
  if(r.act==="Hide"&&!showH) return false;
  if(cat!=="全部"){
    if(catOf(r.name)!==cat) return false;
    if(sub && subOf(r.name)!==sub) return false;
  }
  if(!term) return true;
  const n=nameOf(r);
  const hay=(r.name+" "+(n.en||"")+" "+(n.zh||"")+" "+r.conds.map(c=>c.k+" "+c.v).join(" ")).toLowerCase();
  return hay.includes(term);
}

/* ================= 左側分類 ================= */
function buildNav(){
  const tree={};
  RULES.forEach(r=>{
    const c=catOf(r.name), s=subOf(r.name);
    tree[c]=tree[c]||{n:0,subs:{}};
    tree[c].n++; tree[c].subs[s]=(tree[c].subs[s]||0)+1;
  });
  const nav=$("cats");
  nav.innerHTML="";
  const mk=(label,count,active,cls,onclick)=>{
    const b=document.createElement("button");
    b.className="navbtn"+(cls?" "+cls:"");
    b.innerHTML=`<span>${esc(label)}</span><span class="n">${count}</span>`;
    b.setAttribute("aria-current",active);
    b.onclick=onclick;
    nav.appendChild(b);
    return b;
  };
  mk("全部",RULES.length,cat==="全部",null,()=>{cat="全部";sub=null;buildNav();render();});
  const sep=document.createElement("div"); sep.className="navsep"; nav.appendChild(sep);

  Object.entries(tree).sort((a,b)=>b[1].n-a[1].n).forEach(([c,info])=>{
    mk(c,info.n,cat===c&&!sub,null,()=>{
      if(cat===c && open.has(c)){ open.delete(c); } else { open.add(c); }
      cat=c; sub=null; buildNav(); render();
    });
    if(open.has(c)){
      Object.entries(info.subs).sort((a,b)=>b[1]-a[1]).forEach(([s,n])=>{
        mk(s,n,cat===c&&sub===s,"sub",()=>{ cat=c; sub=s; buildNav(); render(); });
      });
    }
  });
}

/* ================= 右側地上預覽 ================= */
function displayName(r){
  const n=nameOf(r);
  if(n.fallback) return esc(n.fallback);
  let txt;
  if(lang==="en")      txt = n.en;
  else if(lang==="zh") txt = n.zh || n.en;
  else                 txt = n.zh ? `${n.zh}` : n.en;
  let out=esc(txt||"物品");
  if(lang==="both" && n.zh) out += ` <span style="opacity:.6;font-size:.8em">${esc(n.en)}</span>`;
  if(n.extra) out += ` <span style="opacity:.6;font-size:.8em">＋${n.extra}</span>`;
  return out;
}
function labelHtml(r,scale){
  const s=r.style;
  const px=Math.max(10,Math.round((s.size||32)*(scale||0.5)));
  return `<span class="lbl" style="color:${s.text||"#c8c8c8"};
     background:${s.bg||"rgba(0,0,0,.5)"};
     border:${s.border?`2px solid ${s.border}`:"2px solid transparent"};
     font-size:${px}px">${displayName(r)}</span>`;
}
function beamHtml(r){
  const s=r.style; if(!s.beam) return "";
  return `<span class="beamdot ${s.beamTemp?"temp":""}" title="光柱 ${s.beam}"
    style="color:${ICOL[s.beam]||"#fff"}"></span>`;
}
function iconHtml(r,px){
  const s=r.style; if(!s.icon||!SHAPES[s.icon.shape]) return "";
  const d=px||[20,15,11][s.icon.size]||15;
  return `<span class="mini"><svg width="${d}" height="${d}" viewBox="0 0 24 24"
    fill="${ICOL[s.icon.color]||"#aaa"}">${SHAPES[s.icon.shape]}</svg></span>`;
}

function render(){
  const term=$("fq").value.trim().toLowerCase();
  const list=RULES.filter(r=>matches(r,term));

  $("gtitle").innerHTML = (cat==="全部"?"全部規則":esc(cat)+(sub?" · "+esc(sub):"")) +
    ` <b>${list.length}</b> 條`;
  $("stat") && ($("stat").innerHTML="");

  const g=$("ground");
  g.style.display = cols>1 ? "grid" : "flex";
  g.style.gridTemplateColumns = cols>1 ? `repeat(${cols},minmax(0,1fr))` : "";
  if(!list.length){ g.innerHTML=`<div class="none">沒有符合的規則。</div>`; return; }

  g.innerHTML=list.slice(0,600).map((r,i)=>{
    const idx=RULES.indexOf(r);
    const s=r.style;
    const px=Math.max(10,Math.round((s.size||32)*0.5));
    const bare = r.act==="Hide" && !s.text && !s.bg && !s.border;
    return `<div class="grow ${r.act==="Hide"?"dim":""}" data-i="${idx}">
      ${bare?`<span class="ghost">${displayName(r)}</span>`:labelHtml(r)}
      ${iconHtml(r)}${beamHtml(r)}
    </div>`;
  }).join("") + (list.length>600
    ? `<div class="none">還有 ${list.length-600} 條，用搜尋或點左邊的子分類縮小。</div>` : "");
}

/* ================= 編輯視窗 ================= */
const COLORS=["Red","Green","Blue","Brown","White","Yellow","Cyan","Grey","Orange","Pink","Purple"];
const SHAPE_LIST=Object.keys(SHAPES);

const toHex=c=>{
  const m=String(c||"").match(/rgba?\((\d+),(\d+),(\d+)/);
  if(!m) return "#ffffff";
  return "#"+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,"0")).join("");
};
const alphaOf=c=>{
  const m=String(c||"").match(/rgba\([^)]*,([\d.]+)\)$/);
  return m?Math.round(parseFloat(m[1])*255):255;
};
const mkRgba=(hex,a)=>{
  const n=hex.replace("#","");
  const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
  return `rgba(${r},${g},${b},${(a??255)/255})`;
};
const rgbTriple=c=>{
  const m=String(c||"").match(/rgba?\((\d+),(\d+),(\d+)(?:,([\d.]+))?\)/);
  if(!m) return null;
  const a=m[4]!==undefined?Math.round(parseFloat(m[4])*255):255;
  return a>=255 ? `${m[1]} ${m[2]} ${m[3]}` : `${m[1]} ${m[2]} ${m[3]} ${a}`;
};

let editing=-1;

function colorRow(key,label,val){
  const on = !!val;
  return `<div class="erow">
    <label class="ek"><input type="checkbox" data-on="${key}" ${on?"checked":""}> ${label}</label>
    <input type="color" data-hex="${key}" value="${toHex(val)}" ${on?"":"disabled"}>
    <label class="ea">透明 <input type="number" data-a="${key}" min="0" max="255"
      value="${alphaOf(val)}" ${on?"":"disabled"}></label>
  </div>`;
}

function editor(i){
  editing=i;
  const r=RULES[i]; if(!r) return;
  const s=r.style, nm=nameOf(r);

  const conds=r.conds.map(c=>{
    let v=esc(c.v);
    if(c.k==="Rarity") v=v.replace(/Normal|Magic|Rare|Unique/g,m=>RAR[m]);
    return `<div class="frow"><span class="k">${CN[c.k]||c.k}</span><span class="v">${v}</span></div>`;
  }).join("") || `<div class="frow"><span class="k">條件</span><span class="v">無（所有剩餘物品）</span></div>`;

  $("fsheet").innerHTML=`
    <h3><span class="act ${r.act==="Hide"?"a-hide":"a-show"}">${r.act==="Hide"?"隱藏":"顯示"}</span>${esc(r.name||"（未命名規則）")}</h3>
    ${nm.en?`<div class="ensub">${esc(nm.en)}${nm.zh?`　→　${esc(nm.zh)}`:"　（terms.js 沒有這筆）"}</div>`:""}
    <div class="fstage" id="epv"></div>

    <div class="ebox">
      <div class="erow">
        <label class="ek">動作</label>
        <select data-f="act">
          <option value="Show" ${r.act==="Show"?"selected":""}>顯示</option>
          <option value="Hide" ${r.act==="Hide"?"selected":""}>隱藏</option>
        </select>
      </div>
      ${colorRow("text","字體顏色",s.text)}

      <div class="erow">
        <label class="ek">字體大小</label>
        <input type="range" data-f="size" min="18" max="100" value="${s.size||32}">
        <span class="eval" id="esize">${s.size||32}</span>
        <span class="ecap" id="ecap" ${(s.size||32)>45?"":"hidden"}>遊戲上限 45</span>
      </div>
      <div class="erow">
        <label class="ek"><input type="checkbox" data-on="icon" ${s.icon?"checked":""}> 小地圖</label>
        <select data-f="isize" ${s.icon?"":"disabled"}>
          ${[0,1,2].map(n=>`<option value="${n}" ${s.icon&&s.icon.size==n?"selected":""}>${["大","中","小"][n]}</option>`).join("")}
        </select>
        <select data-f="icolor" ${s.icon?"":"disabled"}>
          ${COLORS.map(c=>`<option ${s.icon&&s.icon.color===c?"selected":""}>${c}</option>`).join("")}
        </select>
        <select data-f="ishape" ${s.icon?"":"disabled"}>
          ${SHAPE_LIST.map(c=>`<option ${s.icon&&s.icon.shape===c?"selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="erow">
        <label class="ek"><input type="checkbox" data-on="beam" ${s.beam?"checked":""}> 光柱</label>
        <select data-f="bcolor" ${s.beam?"":"disabled"}>
          ${COLORS.map(c=>`<option ${s.beam===c?"selected":""}>${c}</option>`).join("")}
        </select>
        <label class="ea"><input type="checkbox" data-f="btemp" ${s.beamTemp?"checked":""} ${s.beam?"":"disabled"}> 只閃一下</label>
      </div>
    </div>

    <div class="ehint">比對條件（不能改，避免改壞）</div>
    ${conds}
    ${r.extras.map(([k,v])=>`<div class="frow"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}

    <div class="ebtns">
      <button class="fclose" id="ecancel">取消</button>
      <button class="fclose pri" id="eok">套用</button>
    </div>`;

  const sheet=$("fsheet");
  const draft=JSON.parse(JSON.stringify({act:r.act,style:s}));

  function paint(){
    const fake={act:draft.act,style:draft.style,name:r.name,conds:r.conds};
    $("epv").innerHTML=labelHtml(fake,0.72)+iconHtml(fake,24)+beamHtml(fake);
  }
  paint();

  sheet.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.on!==undefined){
      const k=t.dataset.on, on=t.checked;
      sheet.querySelectorAll(`[data-hex="${k}"],[data-a="${k}"]`).forEach(x=>x.disabled=!on);
      if(k==="icon"){
        sheet.querySelectorAll('[data-f="isize"],[data-f="icolor"],[data-f="ishape"]').forEach(x=>x.disabled=!on);
        draft.style.icon = on ? {size:+sheet.querySelector('[data-f="isize"]').value,
          color:sheet.querySelector('[data-f="icolor"]').value,
          shape:sheet.querySelector('[data-f="ishape"]').value} : null;
      } else if(k==="beam"){
        sheet.querySelectorAll('[data-f="bcolor"],[data-f="btemp"]').forEach(x=>x.disabled=!on);
        draft.style.beam = on ? sheet.querySelector('[data-f="bcolor"]').value : null;

          +sheet.querySelector(`[data-a="${k}"]`).value) : null;

    paint();
  });

    $("fveil").classList.remove("on");
    buildNav(); render(); markDirty();
  };

}

/* ================= 批次調整 ================= */

        <label class="ek"><input type="checkbox" data-use="size"> 字體大小</label>
        <input type="range" data-f="size" min="18" max="100" value="${s.size||32}" disabled>
        <span class="eval" id="bsize">${s.size||32}</span>

      </div>
      <div class="erow">
        <label class="ek"><input type="checkbox" data-use="icon"> 小地圖</label>
        <select data-f="ion" disabled>
          <option value="on">設定成</option><option value="off">全部移除</option>
        </select>
        <select data-f="isize" disabled>${[0,1,2].map(n=>`<option value="${n}">${["大","中","小"][n]}</option>`).join("")}</select>

      </div>
      <div class="erow">
        <label class="ek"><input type="checkbox" data-use="beam"> 光柱</label>
        <select data-f="bon" disabled>
          <option value="on">設定成</option><option value="off">全部移除</option>
        </select>
        <select data-f="bcolor" disabled>${COLORS.map(c=>`<option>${c}</option>`).join("")}</select>

      + iconHtml({style:st}) + beamHtml({style:st});

  $("bcancel").onclick=()=>$("fveil").classList.remove("on");
  $("bok").onclick=()=>{
    if(!Object.values(use).some(Boolean)){ alert("沒有勾選任何要修改的項目。"); return; }
    snapshot(`批次改了 ${list.length} 條`);
    list.forEach(r=>{ apply(r); r.edited=true; });
    $("fveil").classList.remove("on");
    buildNav(); render(); markDirty();
  };
  $("fveil").classList.add("on");
}

/* ================= 匯出 ================= */
let dirty=false;
const HIST=[];
function snapshot(label){
  HIST.push({label, data:RULES.map(r=>({act:r.act, style:JSON.parse(JSON.stringify(r.style)), edited:!!r.edited}))});
  if(HIST.length>30) HIST.shift();
  drawUndo();
}
function drawUndo(){
  const b=$("fundo");
  if(!b) return;
  b.hidden = HIST.length===0;
  b.textContent = HIST.length ? `復原（${HIST.length}）` : "復原";
}
function undo(){
  const h=HIST.pop(); if(!h) return;
  h.data.forEach((d,i)=>{ RULES[i].act=d.act; RULES[i].style=d.style; RULES[i].edited=d.edited; });
  drawUndo(); buildNav(); render();
}
function markDirty(){
  dirty=true;
  const b=$("fdl");
  if(b){ b.hidden=false; b.textContent="下載修改後的 .filter"; }
}
function styleLines(r){
  const s=r.style, L=[];
  if(s.text)   L.push("\tSetTextColor "+rgbTriple(s.text));
  if(s.bg)     L.push("\tSetBackgroundColor "+rgbTriple(s.bg));
  if(s.border) L.push("\tSetBorderColor "+rgbTriple(s.border));
  if(s.size)   L.push("\tSetFontSize "+s.size);
  if(s.icon)   L.push(`\tMinimapIcon ${s.icon.size} ${s.icon.color} ${s.icon.shape}`);
  if(s.beam)   L.push("\tPlayEffect "+s.beam+(s.beamTemp?" Temp":""));
  return L;
}
const STYLE_KEYS=["SetTextColor","SetBackgroundColor","SetBorderColor","SetFontSize","MinimapIcon","PlayEffect"];
function exportText(){
  const out=["# 由 PoE 工具箱編輯過　"+new Date().toLocaleString("zh-TW"),""];
  RULES.forEach(r=>{
    out.push(r.act+(r.name?" # "+r.name:""));
    if(!r.edited){
      r.raw.forEach(l=>out.push(l));
    }else{
      // 保留非樣式的原始行，樣式行整組換新
      r.raw.forEach(l=>{
        const k=l.trim().split(/\s+/)[0];
        if(!STYLE_KEYS.includes(k)) out.push(l);
      });
      styleLines(r).forEach(l=>out.push(l));
    }
    out.push("");
  });
  return out.join("\n");
}
function download(){
  const blob=new Blob([exportText()],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="edited.filter";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ================= 匯入與互動 ================= */
function load(text){
  RULES=parse(text);
  if(!RULES.length){ alert("解析不到任何規則，確認檔案內容是不是過濾器。"); return; }
  cat="全部"; sub=null; open.clear(); dirty=false;
  HIST.length=0; $("fdl").hidden=true; drawUndo();
  $("importer").hidden=true; $("app").hidden=false;
  buildNav(); render();
}
const drop=$("drop"), file=$("file");
drop.onclick=()=>file.click();
file.onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(load); };
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) f.text().then(load); });
$("paste").addEventListener("input",e=>{
  if(e.target.value.length>200 && /^(Show|Hide)\b/m.test(e.target.value)) load(e.target.value);
});
$("fq").addEventListener("input",render);
$("reset").onclick=()=>{ $("importer").hidden=false; $("app").hidden=true;
  $("paste").value=""; file.value=""; };
$("ground").addEventListener("click",e=>{
  const row=e.target.closest(".grow"); if(row) editor(+row.dataset.i);
});
$("fveil").addEventListener("click",e=>{ if(e.target===$("fveil")) $("fveil").classList.remove("on"); });
addEventListener("keydown",e=>{ if(e.key==="Escape") $("fveil").classList.remove("on"); });
const tg=(id,get,set)=>{ const b=$(id);
  b.onclick=()=>{ set(!get()); b.setAttribute("aria-pressed",get()); render(); }; };
tg("fShow",()=>showS,v=>showS=v);
tg("fHide",()=>showH,v=>showH=v);

const LANGS=[["zh","中文"],["en","English"],["both","中英"]];
const langBtn=$("flang");
function drawLang(){ langBtn.textContent=LANGS.find(l=>l[0]===lang)[1]; }
langBtn.onclick=()=>{
  lang=LANGS[(LANGS.findIndex(l=>l[0]===lang)+1)%LANGS.length][0];
  drawLang(); render();
};
drawLang();

$("fdl").onclick=download;
$("fbatch").onclick=batch;
$("fundo").onclick=undo;
$("fcols").addEventListener("input",e=>{
  const v=Math.max(1,Math.min(8,parseInt(e.target.value)||1));
  cols=v; render();
});

})();
</script>
<script>
(function(){
if(typeof BEASTS==="undefined"){
  document.getElementById("blist").innerHTML =
    `<div class="bnone">找不到 <code>beasts.js</code><br>它要跟這個網頁放在同一個資料夾。</div>`;
} else {
  const $b=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  let fam="全部", sort="none";
  const GCOL={ "獸性":"#4C7DE0", "飛沙":"#E0554C", "洞窟":"#4CC24C", "深潭":"#A96FD0", "其他":"#8B7F6E" };
  function hit(t,term){
    const s=esc(t||"");
    if(!term) return s;
    const i=s.toLowerCase().indexOf(term);
    return i<0?s:s.slice(0,i)+"<em>"+s.slice(i,i+term.length)+"</em>"+s.slice(i+term.length);
  }
  function famList(){
    const map={};
    BEASTS.forEach(b=>{ const g=b.group||"未分類"; map[g]=(map[g]||0)+1; });
    const nav=$b("bfam"); nav.innerHTML="";
    const mk=(label,count,active,color,onclick)=>{
      const el=document.createElement("button");
      el.className="bnav";
      el.innerHTML=(color?`<span class="gdot" style="background:${color}"></span>`:"")+
        `<span class="gname">${esc(label)}</span><span class="n">${count}</span>`;
      el.setAttribute("aria-current",active);
      if(color) el.style.setProperty("--gc",color);
      el.onclick=onclick; nav.appendChild(el);
    };
    mk("全部",BEASTS.length,fam==="全部",null,()=>{fam="全部";famList();draw();});
    const sep=document.createElement("div"); sep.className="bnavsep"; nav.appendChild(sep);
    Object.keys(map).forEach(g=>mk(g,map[g],fam===g,GCOL[g]||"#8B7F6E",
      ()=>{fam=g;famList();draw();}));
  }

  let lastCount=0;
  function paintTally(){
    $b("btally").innerHTML=`<b>${lastCount}</b> 隻 · 已勾選 <b>${picked.size}</b> 隻`;
  }

  function draw(){
    const term=$b("bq").value.trim().toLowerCase();
    let list=BEASTS.map((b,i)=>({b,i}))
      .filter(({b})=>(fam==="全部"||b.group===fam))
      .filter(({b})=>!term ||
        (b.name+" "+(Array.isArray(b.use)?b.use.join(" "):(b.use||""))+" "+
         (b.note||"")+" "+(b.group||"")).toLowerCase().includes(term));

    if(sort==="name")   list.sort((a,z)=>a.b.name.localeCompare(z.b.name,"zh-Hant"));

    lastCount=list.length;
    paintTally();

    $b("blist").innerHTML = list.length ? list.map(({b})=>`
      <div class="brow ${picked.has(b.name)?"on":""}" style="--gc:${GCOL[b.group]||"#8B7F6E"}">
        <span class="bnamecell">
          <input type="checkbox" class="bpick" data-n="${esc(b.name)}" ${picked.has(b.name)?"checked":""}>
          <span class="gbar"></span>
          ${fam==="全部"?`<span class="bfam2">${esc(b.group||"")}</span>`:""}
          <span class="bname">${hit(b.name,term)}</span>
        </span>
        <span>
          <span class="buse">${
            Array.isArray(b.use)
              ? b.use.map(u=>`<span class="uline">${hit(u,term)}</span>`).join("")
              : (b.use ? hit(b.use,term) : "<span style='color:#5C554B'>—</span>")
          }</span>
          ${b.note?`<span class="bnote">${hit(b.note,term)}</span>`:""}
        </span>
      </div>`).join("")
      : `<div class="bnone">沒有符合的野獸。</div>`;
  }

  $b("bq").addEventListener("input",draw);
  $b("bsort").addEventListener("change",e=>{ sort=e.target.value; draw(); });
  /* ---------- 分揀工具 ---------- */
  const picked=new Set();          // 打勾的野獸名稱
  const SAVE_KEY="poe-tool/beast-picked";

  /* 記住勾選：存在這台電腦的瀏覽器裡，換電腦或別人連進來都是各自獨立的 */
  function saveP(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify([...picked])); }catch(e){}
  }
  function loadP(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const names=new Set(BEASTS.map(b=>b.name));
      JSON.parse(raw).forEach(n=>{ if(names.has(n)) picked.add(n); });  // 資料改過就自動忽略舊名字
    }catch(e){}
  }

  /* 共用前綴提取：菲恩絲吞噬獸|菲恩絲毒蠍 → 菲恩絲(吞噬獸|毒蠍)
     名字仍然完整，比對結果不變，只是省字數。 */
  function compress(names){
    const groups=new Map();          // 前綴 → [後半段]
    const pool=[...names];

    // 從長到短找共用前綴，優先用長的（省最多）
    for(let len=5; len>=2; len--){
      const buckets={};
      pool.forEach(n=>{
        if(n.length<=len) return;
        const p=n.slice(0,len);
        (buckets[p]=buckets[p]||[]).push(n);
      });
      Object.entries(buckets).forEach(([p,members])=>{
        if(members.length<2) return;                       // 只有一個不划算
        const before=members.reduce((a,n)=>a+n.length+1,0)-1;
        const tails=members.map(n=>n.slice(len));
        const after=p.length+2+tails.reduce((a,t)=>a+t.length+1,0)-1;
        if(after>=before) return;                          // 沒省到就不做
        groups.set(p,tails);
        members.forEach(n=>{ const i=pool.indexOf(n); if(i>=0) pool.splice(i,1); });
      });
    }

    const out=[];
    groups.forEach((tails,p)=>out.push(`${p}(${tails.join("|")})`));
    pool.forEach(n=>out.push(n));
    return out;
  }

  /* 分段：每段不超過字數上限。有前置詞的話，它也算進長度 */
  function chunk(tokens,limit,pre){
    const extra = pre ? pre.length+2 : 0;   // 前置詞 + 左右括號
    const room  = Math.max(10, limit-extra);
    const segs=[]; let cur="";
    tokens.forEach(t=>{
      const next = cur ? cur+"|"+t : t;
      if(next.length>room && cur){ segs.push(cur); cur=t; }
      else cur=next;
    });
    if(cur) segs.push(cur);
    return segs.map(x=> pre ? `${pre}(${x})` : x);
  }

  function renderSegs(boxId,segs,rawCount){
    const box=$b(boxId);
    if(!segs.length){ box.innerHTML=`<div class="bempty">沒有符合的野獸</div>`; return; }
    box.innerHTML=segs.map((t,i)=>`
      <div class="bseg">
        <div class="bsegh">
          <span>${segs.length>1?`第 <b>${i+1}</b> / ${segs.length} 段`:"名單"} · ${t.length} 字</span>
          <button class="bsq" data-seg="${boxId}-${i}">複製</button>
        </div>
        <textarea readonly spellcheck="false" id="${boxId}-${i}">${t.replace(/</g,"&lt;")}</textarea>
      </div>`).join("");
  }

  function runSplit(){
    const limit = 250;                 // 遊戲內篩選框的字數上限
    const keep=[], drop=[];
    BEASTS.forEach(b=>{ (picked.has(b.name)?keep:drop).push(b.name); });
    renderSegs("bkeepbox", chunk(compress(keep),limit,""), keep.length);
    renderSegs("bdropbox", chunk(compress(drop),limit,""), drop.length);
    $b("bkeepn").textContent = keep.length+" 隻";
    $b("bdropn").textContent = drop.length+" 隻";
  }

  /* 每一段的複製鈕 */
  document.getElementById("tab-beast").addEventListener("click",e=>{
    const btn=e.target.closest(".bsq"); if(!btn) return;
    const ta=document.getElementById(btn.dataset.seg);
    if(!ta||!ta.value) return;
    const done=()=>{
      btn.textContent="已複製"; btn.classList.add("done");
      setTimeout(()=>{ btn.textContent="複製"; btn.classList.remove("done"); },1400);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done).catch(()=>{
        ta.removeAttribute("readonly"); ta.select();
        try{ document.execCommand("copy"); done(); }catch(_){}
        ta.setAttribute("readonly","");
      });
    }else{
      ta.removeAttribute("readonly"); ta.select();
      try{ document.execCommand("copy"); done(); }catch(_){}
      ta.setAttribute("readonly","");
    }
  });

  $b("ball").onclick=()=>{ BEASTS.forEach(b=>picked.add(b.name)); saveP(); draw(); runSplit(); };
  $b("bnone").onclick=()=>{ picked.clear(); saveP(); draw(); runSplit(); };
  $b("bclr").onclick=()=>{
    if(!confirm("要清除記住的勾選嗎？")) return;
    picked.clear();
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    draw(); runSplit();
  };

  /* 點勾選框即時更新名單 */
  function togglePick(name,on,row){
    if(on) picked.add(name); else picked.delete(name);
    row.classList.toggle("on",on);
    const cb=row.querySelector(".bpick"); if(cb) cb.checked=on;
    saveP(); runSplit(); paintTally();
  }
  $b("blist").addEventListener("change",e=>{
    const cb=e.target.closest(".bpick"); if(!cb) return;
    togglePick(cb.dataset.n, cb.checked, cb.closest(".brow"));
  });
  /* 點整列任何地方都能勾選 */
  $b("blist").addEventListener("click",e=>{
    if(e.target.closest(".bpick")) return;
    const row=e.target.closest(".brow"); if(!row) return;
    if(String(window.getSelection?.()||"").length) return;
    const cb=row.querySelector(".bpick"); if(!cb) return;
    togglePick(cb.dataset.n, !cb.checked, row);
  });


  loadP();
  famList(); draw(); runSplit();
}

})();
</script>

(function(){

} else {

    keys.forEach(g=>mk(g,map[g],fam===g,()=>{fam=g;famList();draw();}));
  }

  function draw(){
    const term=$t("tq").value.trim().toLowerCase();
    let list=TALISMANS.map((t,i)=>({t,i}))
      .filter(({t})=>fam==="全部"||t.group===fam)
      .filter(({t})=>!term ||
        (t.name+" "+useText(t)+" "+(t.note||"")+" "+(t.group||"")).toLowerCase().includes(term));

    if(sort==="price")  list.sort((a,z)=>(inC(z.t)??-1)-(inC(a.t)??-1)||a.i-z.i);
    if(sort==="price2") list.sort((a,z)=>(inC(a.t)??1e9)-(inC(z.t)??1e9)||a.i-z.i);
    if(sort==="name")   list.sort((a,z)=>a.t.name.localeCompare(z.t.name,"zh-Hant"));

    const known=list.filter(x=>x.t.price!=null);
    const sum=known.reduce((s,x)=>s+inC(x.t),0);
    $t("ttally").innerHTML=`<b>${list.length}</b> 個${known.length?` · 合計 <b>${sum.toLocaleString("en-US")}</b>c`:""}`;

    $t("tlist").innerHTML = list.length ? list.map(({t})=>`
      <div class="trow">

            Array.isArray(t.use)
              ? t.use.map(u=>`<span class="tuline">${hit(u,term)}</span>`).join("")
              : (t.use ? hit(t.use,term) : "<span style='color:#5C554B'>—</span>")
          }</span>
          ${t.note?`<span class="tnote">${hit(t.note,term)}</span>`:""}
        </span>
        ${priceTag(t)}
      </div>`).join("")
      : `<div class="tnone">沒有符合的魔符。</div>`;
  }

  $t("tq").addEventListener("input",draw);
  $t("tsort").addEventListener("change",e=>{ sort=e.target.value; draw(); });
