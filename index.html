<script>
(function(){
const $m=id=>document.getElementById(id);
const Dg = n => String(n).split("").map(Number);

/* ---------- 計算核心 ---------- */
function addSteps(a,b){
  const A=Dg(a).reverse(), B=Dg(b).reverse();
  const n=Math.max(A.length,B.length)+1;
  const cols=[]; let carry=0;
  for(let i=0;i<n;i++){
    const s=(A[i]||0)+(B[i]||0)+carry;
    cols.push({ top:A[i], bot:B[i], carryIn:carry, digit:s%10 });
    carry = s>=10?1:0;
  }
  while(cols.length>1){
    const c=cols[cols.length-1];
    if(c.top===undefined&&c.bot===undefined&&c.carryIn===0) cols.pop(); else break;
  }
  return { op:"+", a, b, cols, result:Number(a)+Number(b) };
}
function subSteps(a,b){
  const A=Dg(a).reverse(), B=Dg(b).reverse();
  const st=A.map(d=>[{v:d,kind:"orig"}]);          // 每欄的變化過程
  const val=i=>st[i][st[i].length-1].v;
  function borrow(j){                               // 跟第 j 欄借 1
    if(j>=st.length) return;
    if(val(j)>0){ st[j].push({v:val(j)-1,kind:"give"}); return; }
    borrow(j+1);                                    // 自己是 0，先往更左邊借
    st[j].push({v:val(j)+10,kind:"recv"});
    st[j].push({v:val(j)-1,kind:"give"});
  }
  const cols=[];
  for(let i=0;i<A.length;i++){
    const y=B[i]||0;
    if(val(i)<y){ borrow(i+1); st[i].push({v:val(i)+10,kind:"recv"}); }
    cols.push({ top:A[i], bot:B[i], stack:st[i], used:val(i), digit:val(i)-y });
  }
  const depth=Math.max(...cols.map(c=>c.stack.length));
  return { op:"-", a, b, cols, depth, result:Number(a)-Number(b) };
}

function mulSteps(a,b){
  const B=Dg(b).reverse();
  const rows=B.map((d,i)=>({ d, shift:i, val:Number(a)*d*Math.pow(10,i) }));
  return { op:"×", a, b, rows, result:Number(a)*Number(b) };
}
function divSteps(a,b){
  const d=Number(b);
  if(!d) return { op:"÷", a, b, error:"除數不能是 0" };
  const A=Dg(a), steps=[]; let cur=0, q="";
  A.forEach((digit,i)=>{
    cur=cur*10+digit;
    const qd=Math.floor(cur/d);
    q+=qd;
    steps.push({ i, cur, qd, sub:qd*d, rem:cur-qd*d });
    cur-=qd*d;
  });
  return { op:"÷", a, b, steps, quotient:Number(q), remainder:cur };
}
const calc=(a,op,b)=> op==="+"?addSteps(a,b) : op==="-"?subSteps(a,b)
                    : op==="×"?mulSteps(a,b) : divSteps(a,b);

/* ---------- 直式排版 ---------- */
const cell=(txt,cls)=>`<div class="vcell ${cls||""}">${txt===undefined||txt===null?"":txt}</div>`;

function renderAddSub(r,upto){
  const n=r.cols.length, W=n+1;
  const on=k=>upto===undefined||k<upto;          // 第 k 欄（右起 0）是否已揭露
  const top=[], bot=[], res=[];
  for(let k=n-1;k>=0;k--){
    const c=r.cols[k];
    const slashed = r.op==="-" && c.stack.length>1 && (on(k) || (k>=1 && on(k-1)));
    top.push(cell(c.top, slashed?"vstrike":""));
    bot.push(cell(c.bot));
    res.push(cell(on(k)?c.digit:"", on(k)?"vres":"vres vsoft"));
  }

  let marks="";
  if(r.op==="+"){
    const row=[];
    for(let k=n-1;k>=0;k--) row.push(cell(on(k+1)&&r.cols[k].carryIn?"1":"","vcarry"));
    marks = cell("")+row.join("");
  }else{
    /* 第 L 層（1 = 緊貼在數字上方），越上面層數越大，所以由大到小畫 */
    for(let L=r.depth-1; L>=1; L--){
      const row=[];
      for(let k=n-1;k>=0;k--){
        const st=r.cols[k].stack;
        const seen = on(k) || (k>=1 && on(k-1));      // 自己算過，或右邊跟自己借過
        const e = seen ? st[L] : undefined;
        const cls = "vmark" + (e && L < st.length-1 ? " vstrike" : "");
        row.push(cell(e===undefined ? "" : (e.kind==="recv" ? 10 : e.v), cls));
      }
      marks += cell("")+row.join("");
    }
  }

  return `<div class="vgrid" style="grid-template-columns:repeat(${W},auto)">
    ${marks}
    ${cell("")}${top.join("")}
    ${cell(r.op,"vop")}${bot.join("")}
    <div class="vline"></div>
    ${cell("")}${res.join("")}
  </div>`;
}

function renderMul(r,upto){
  const digits = String(r.result).length;
  const W = Math.max(String(r.a).length, String(r.b).length+1, digits)+1;
  const row = (num, cls, opSym) => {
    const s=String(num).split("");
    const pad=W-1-s.length;
    return cell(opSym||"", opSym?"vop":"") +
      Array(pad).fill(cell("")).join("") + s.map(d=>cell(d,cls)).join("");
  };
  const shown = upto===undefined ? r.rows : r.rows.slice(0,upto);
  const parts = r.rows.length>1 ? shown.map(p=>row(p.val,"vpart")).join("") : "";
  const done  = upto===undefined || upto>r.rows.length;
  return `<div class="vgrid" style="grid-template-columns:repeat(${W},auto)">
    ${row(r.a)}
    ${row(r.b,"", "×")}
    <div class="vline"></div>
    ${parts}
    ${r.rows.length>1&&done?'<div class="vline"></div>':""}
    ${done?row(r.result,"vres"):""}
  </div>`;
}

function renderDiv(r,upto){
  if(r.error) return `<div class="merr">${r.error}</div>`;
  const A=String(r.a).split(""), n=A.length, W=n+1;
  const pad=k=>Array(Math.max(0,k)).fill(cell("")).join("");
  /* 把數字靠右對齊到第 col 欄（0 起算，欄位從商的第一位開始） */
  const at=(num,col,cls)=>{
    const s=String(num).split("");
    return cell("")+pad(col-s.length+1)+s.map(x=>cell(x,cls)).join("")+pad(n-1-col);
  };
  const qs=String(r.quotient).padStart(n,"·").split("");
  const q = upto===undefined ? qs
    : qs.map((x,i)=> i < (n-String(r.quotient).length) + upto ? x : "·");
  let html=`<div class="vgrid" style="grid-template-columns:repeat(${W},auto)">
    ${cell("")}${q.map(x=>cell(x==="·"?"":x,"vres")).join("")}
    <div class="vline"></div>
    ${cell(r.b,"vop")}${A.map(x=>cell(x)).join("")}`;
  r.steps.forEach((st,i)=>{
    if(upto!==undefined && i>=upto) return;
    if(st.qd===0 && st.cur===0) return;           // 這一位還不夠除，跳過
    html += at(st.sub, i, "vpart");               // 減掉的數
    const next = i<n-1 ? st.rem*10+Number(A[i+1]) : st.rem;
    html += at(next, i<n-1 ? i+1 : i, "vdim");    // 餘數（含借下來的那位）
  });
  html+=`</div>`;
  return html;
}

const PLACE=["個位","十位","百位","千位","萬位","十萬位","百萬位"];

/* 每一步的說明 */
function narrate(r,k){
  if(r.op==="+"){
    const c=r.cols[k]; if(!c) return "";
    const x=c.top??0, y=c.bot??0, sum=x+y+c.carryIn;
    const carryTxt = c.carryIn ? `${x} + ${y} + 進位 1 = ${sum}` : `${x} + ${y} = ${sum}`;
    return `${PLACE[k]}：${carryTxt}` + (sum>=10
      ? `，滿十要進位，寫 ${sum%10}，進 1 到${PLACE[k+1]||"上一位"}` : `，寫 ${sum}`);
  }
  if(r.op==="-"){
    const c=r.cols[k]; if(!c) return "";
    const y=c.bot??0, st=c.stack, here=PLACE[k], left=PLACE[k+1]||"左邊一位";
    if(st.length===1) return `${here}：${st[0].v} − ${y} = ${c.digit}，直接減，不用借位。`;
    const say=[`${here}：${st[0].v} 減 ${y} 不夠減。`];
    for(let i=1;i<st.length;i++){
      const e=st[i], prev=st[i-1].v;
      if(e.kind==="recv")
        say.push(`跟${left}借 1，借來的是 10，所以${here}變成 10 + ${prev} = ${e.v}。`);
      else
        say.push(`${here}要借 1 給${PLACE[k-1]||"右邊一位"}，所以 ${prev} 劃掉改成 ${e.v}。`);
    }
    say.push(`最後 ${c.used} − ${y} = ${c.digit}。`);
    return say.join("");
  }
  if(r.op==="×"){
    const p=r.rows[k]; if(!p) return `把上面每一列加起來 = ${r.result}`;
    return r.rows.length===1
      ? `${r.a} × ${p.d} = ${r.result}`
      : `${PLACE[k]}的 ${p.d}：${r.a} × ${p.d} = ${p.d*Number(r.a)}，因為在${PLACE[k]}，所以後面補 ${k} 個 0 → ${p.val}`;
  }
  const st=r.steps[k]; if(!st) return "";
  if(st.qd===0 && st.cur===0) return `第 ${k+1} 位是 0，不夠除，商寫 0`;
  return `取到 ${st.cur}：${st.cur} ÷ ${r.b} = ${st.qd} 餘 ${st.rem}，商寫 ${st.qd}`
    + (k<r.steps.length-1 ? `，把下一位借下來` : (st.rem?`，最後餘 ${st.rem}` : "，整除"));
}
const stepCount = r =>
  r.op==="+"||r.op==="-" ? r.cols.length :
  r.op==="×" ? (r.rows.length>1 ? r.rows.length+1 : 1) :
  (r.steps?r.steps.length:0);

const REG={};    // 每張卡片的題目

function renderAt(r,step){
  if(r.op==="+"||r.op==="-") return renderAddSub(r,step);
  if(r.op==="×") return renderMul(r,step);
  return renderDiv(r,step);
}

function card(a,op,b,idx,withStep){
  const r=calc(a,op,b);
  let body, ans;
  if(op==="+"||op==="-"){ body=renderAddSub(r); ans=`= <b>${r.result}</b>`; }
  else if(op==="×"){ body=renderMul(r); ans=`= <b>${r.result}</b>`; }
  else { body=renderDiv(r);
    ans = r.error ? "" : `= <b>${r.quotient}</b>${r.remainder?` ⋯ 餘 <b>${r.remainder}</b>`:""}`; }
  const total=stepCount(r);
  const stepper = (withStep && !r.error && total>0) ? `
    <div class="mstep" data-k="${idx}">
      <div class="mnarr" id="narr-${idx}">按「下一步」開始</div>
      <div class="mstage" id="stage-${idx}">${renderAt(r,0)}</div>
      <div class="mctrl">
        <button class="msq" data-act="prev">◀ 上一步</button>
        <button class="msq mplay" data-act="play">▶ 播放</button>
        <button class="msq" data-act="next">下一步 ▶</button>
        <span class="mcnt" id="cnt-${idx}">0 / ${total}</span>
      </div>
    </div>` : "";
  if(withStep) REG[idx]={ r, step:0, total, timer:null };

  return `<div class="mcard">
    <div class="mtitle"><b>${a} ${op} ${b}</b></div>
    ${body}
    ${ans?`<div class="mans">${ans}</div>`:""}
    ${stepper}
  </div>`;
}

/* ---------- 解析與出題 ---------- */
function parseLine(line){
  const m=String(line).replace(/\s/g,"").match(/^(\d+)\s*([+\-*x×/÷])\s*(\d+)$/i);
  if(!m) return null;
  const op={"*":"×","x":"×","X":"×","/":"÷"}[m[2]]||m[2];
  return [m[1], op, m[3]];
}
function randInt(len){
  const lo=Math.pow(10,len-1), hi=Math.pow(10,len)-1;
  return Math.floor(lo+Math.random()*(hi-lo+1));
}
function genOne(op,len,force){
  for(let t=0;t<200;t++){
    let a=randInt(len), b=randInt(op==="÷"?Math.max(1,len-2):len);
    if(op==="-"){
      if(a<b)[a,b]=[b,a];
      if(force && !subSteps(a,b).cols.some(c=>c.stack.length>1)) continue;
      return [a,op,b];
    }
    if(op==="+"){
      if(force && !addSteps(a,b).cols.some(c=>c.carryIn)) continue;
      return [a,op,b];
    }
    if(op==="×"){ return [a,op,randInt(Math.min(2,len))]; }
    if(op==="÷"){ if(b===0) continue; return [a,op,b]; }
  }
  return [randInt(len),op,randInt(Math.max(1,len-1))];
}

/* ---------- 介面 ---------- */
function show(items){
  Object.values(REG).forEach(x=>x.timer&&clearInterval(x.timer));
  for(const k in REG) delete REG[k];
  const withStep = items.length<=8;          // 題目太多就不放演示，避免太吵
  $m("m-out").innerHTML = items.length
    ? items.map(([a,op,b],i)=>card(a,op,b,i,withStep)).join("")
    : `<div class="mnone">沒有可以計算的題目。<br>格式像 <code>2386-1463</code>，一行一題。</div>`;
}
/* 演示控制 */
function paint(i){
  const S=REG[i]; if(!S) return;
  document.getElementById("stage-"+i).innerHTML = renderAt(S.r, S.step);
  document.getElementById("cnt-"+i).textContent = `${S.step} / ${S.total}`;
  document.getElementById("narr-"+i).textContent =
    S.step===0 ? "按「下一步」開始" : narrate(S.r, S.step-1);
}
function stop(i){
  const S=REG[i]; if(!S||!S.timer) return;
  clearInterval(S.timer); S.timer=null;
  const b=document.querySelector(`.mstep[data-k="${i}"] .mplay`);
  if(b){ b.textContent="▶ 播放"; b.classList.remove("on"); }
}
document.getElementById("m-out").addEventListener("click",e=>{
  const btn=e.target.closest(".msq"); if(!btn) return;
  const i=btn.closest(".mstep").dataset.k, S=REG[i]; if(!S) return;
  const act=btn.dataset.act;
  if(act==="next"){ stop(i); S.step=Math.min(S.total,S.step+1); paint(i); }
  if(act==="prev"){ stop(i); S.step=Math.max(0,S.step-1); paint(i); }
  if(act==="play"){
    if(S.timer){ stop(i); return; }
    if(S.step>=S.total) S.step=0;
    btn.textContent="⏸ 暫停"; btn.classList.add("on");
    S.timer=setInterval(()=>{
      S.step++;
      paint(i);
      if(S.step>=S.total) stop(i);
    },1100);
    paint(i);
  }
});

document.querySelectorAll("#tab-math .mmode").forEach(btn=>{
  btn.onclick=()=>{
    const m=btn.dataset.m;
    document.querySelectorAll("#tab-math .mmode").forEach(x=>
      x.setAttribute("aria-pressed", x===btn));
    ["one","many","gen"].forEach(k=>$m("p-"+k).hidden = k!==m);
  };
});
$m("m-go").onclick=()=>{
  const a=$m("m-a").value.trim(), b=$m("m-b").value.trim(), op=$m("m-op").value;
  if(!/^\d+$/.test(a)||!/^\d+$/.test(b)){ alert("請輸入正整數。"); return; }
  show([[a,op,b]]);
};
["m-a","m-b"].forEach(id=>$m(id).addEventListener("keydown",e=>{ if(e.key==="Enter") $m("m-go").click(); }));
$m("m-go2").onclick=()=>{
  const lines=$m("m-many").value.split(/\r?\n/).map(parseLine).filter(Boolean);
  show(lines);
};
$m("g-go").onclick=()=>{
  const op=$m("g-op").value, len=+$m("g-len").value;
  const n=Math.max(1,Math.min(30,+$m("g-n").value||6));
  const force=$m("g-borrow").checked;
  show(Array.from({length:n},()=>genOne(op,len,force)));
};
show([["2386","-","1463"]]);

})();
</script>
<script>
(function(){
if(typeof SCARABS==="undefined"){
  document.getElementById("slist").innerHTML =
    `<div class="snone">找不到 <code>scarabs.js</code><br>它要跟這個網頁放在同一個資料夾。</div>`;
} else {
  const $s=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  const RATE=(typeof DIVINE_RATE!=="undefined")?DIVINE_RATE:200;
  const inC=s=>s.price==null?null:(s.unit==="D"?s.price*RATE:s.price);
  const picked=new Set(), KEY="poe-tool/scarab-picked";
  const PKEY="poe-tool/scarab-prices";
  let over={};                       // 你在網頁上改過的價格
  const saveO=()=>{ try{ localStorage.setItem(PKEY,JSON.stringify(over)); }catch(e){} };
  const loadO=()=>{ try{ over=JSON.parse(localStorage.getItem(PKEY)||"{}"); }catch(e){ over={}; } };
  function applyOver(){
    SCARABS.forEach(s=>{
      const o=over[s.name];
      if(o===undefined) return;
      if(o===null){ delete s.price; delete s.unit; }
      else { s.price=o.p; s.unit=o.u; }
    });
  }
  let fam="全部", sort="none", thrUnit="C";

  const saveP=()=>{ try{ localStorage.setItem(KEY,JSON.stringify([...picked])); }catch(e){} };
  const loadP=()=>{ try{
    const raw=localStorage.getItem(KEY); if(!raw) return;
    const ok=new Set(SCARABS.map(s=>s.name));
    JSON.parse(raw).forEach(n=>{ if(ok.has(n)) picked.add(n); });
  }catch(e){} };

  const UNAME=(typeof UNIT_ICON!=="undefined")?UNIT_ICON:{C:"混沌石",D:"神聖石"};
  const UEXT=[".png",".jpg",".jpeg",".webp"], uc={};
  function findCoin(u){
    const base=UNAME[u]; if(!base) return Promise.resolve(null);
    if(u in uc) return Promise.resolve(uc[u]);
    return new Promise(res=>{ let i=0;
      const next=()=>{ if(i>=UEXT.length){ uc[u]=null; return res(null); }
        const url="img/icon/"+encodeURIComponent(base+UEXT[i++]);
        const im=new Image(); im.onload=()=>{uc[u]=url;res(url);}; im.onerror=next; im.src=url; };
      next(); });
  }
  function paintChips(){
    ["C","D"].forEach(u=>{
      const el=$s("su"+u); el.setAttribute("aria-pressed",thrUnit===u);
      el.innerHTML = uc[u] ? `<img src="${uc[u]}" alt="">` : (u==="D"?"神":"c");
    });
  }
  function hit(t,term){
    const s=esc(t||""); if(!term) return s;
    const i=s.toLowerCase().indexOf(term);
    return i<0?s:s.slice(0,i)+"<em>"+s.slice(i,i+term.length)+"</em>"+s.slice(i+term.length);
  }
  /* 價格欄：可以直接在上面改，改完自動記住 */
  function priceTag(s){
    const has=s.price!=null;
    const v=has?inC(s):null;
    const cls=!has?"p0":v>=500?"p3":v>=100?"p2":"p1";
    const u=s.unit==="D"?"D":"C", word=u==="D"?"神":"c";
    const icon=uc[u]?`<img class="cico" src="${uc[u]}" alt="${word}">`:`<i class="cword">${word}</i>`;
    return `<span class="sprice ${cls}" title="${has&&u==="D"?"約 "+v.toLocaleString("en-US")+" 混沌":"點數字可以直接改"}">
      <input class="pin" type="text" inputmode="decimal" data-n="${esc(s.name)}"
        value="${has?s.price:""}" placeholder="—">
      <button class="pun" data-n="${esc(s.name)}" title="切換混沌／神聖">${icon}</button>
    </span>`;
  }
  const useText=s=>Array.isArray(s.use)?s.use.join(" "):(s.use||"");

  function famList(){
    const map={};
    SCARABS.forEach(s=>{ const g=s.group||"其他"; map[g]=(map[g]||0)+1; });
    const nav=$s("sfam"); nav.innerHTML="";
    const mk=(label,n,active,fn)=>{
      const b=document.createElement("button"); b.className="snav";
      b.innerHTML=`<span>${esc(label)}</span><span class="n">${n}</span>`;
      b.setAttribute("aria-current",active); b.onclick=fn; nav.appendChild(b);
    };
    mk("全部",SCARABS.length,fam==="全部",()=>{fam="全部";famList();draw();});
    const sep=document.createElement("div"); sep.className="snavsep"; nav.appendChild(sep);
    Object.entries(map).sort((a,b)=>b[1]-a[1]).forEach(([g,n])=>
      mk(g,n,fam===g,()=>{fam=g;famList();draw();}));
  }

  function draw(){
    const term=$s("sq").value.trim().toLowerCase();
    let list=SCARABS.map((s,i)=>({s,i}))
      .filter(({s})=>fam==="全部"||s.group===fam)
      .filter(({s})=>!term||(s.name+" "+(s.en||"")+" "+useText(s)+" "+(s.group||"")).toLowerCase().includes(term));
    if(sort==="price")  list.sort((a,z)=>(inC(z.s)??-1)-(inC(a.s)??-1)||a.i-z.i);
    if(sort==="price2") list.sort((a,z)=>(inC(a.s)??1e9)-(inC(z.s)??1e9)||a.i-z.i);
    if(sort==="name")   list.sort((a,z)=>a.s.name.localeCompare(z.s.name,"zh-Hant"));

    const known=list.filter(x=>x.s.price!=null);
    $s("stally").innerHTML=`<b>${list.length}</b> 種${known.length?` · 合計 <b>${known.reduce((a,x)=>a+inC(x.s),0).toLocaleString("en-US")}</b>c`:""}`;

    $s("slist").innerHTML = list.length ? list.map(({s})=>`
      <div class="srow ${picked.has(s.name)?"on":""}">
        <span class="snamecell">
          <input type="checkbox" class="spick" data-n="${esc(s.name)}" ${picked.has(s.name)?"checked":""}>
          ${fam==="全部"?`<span class="sgrp">${esc(s.group||"")}</span>`:""}
          <span class="snamewrap">
            <span class="sname">${hit(s.name,term)}</span>
            ${s.en?`<span class="sen">${hit(s.en,term)}</span>`:""}
          </span>
        </span>
        <span>
          <span class="suse">${Array.isArray(s.use)
            ? s.use.map(u=>`<span class="suline">${hit(u,term)}</span>`).join("")
            : (s.use?hit(s.use,term):"<span style='color:#5C554B'>—</span>")}</span>
          ${s.limit?`<span class="slim">每張圖上限 ${s.limit}</span>`:""}
        </span>
        ${priceTag(s)}
      </div>`).join("") : `<div class="snone">沒有符合的聖甲蟲。</div>`;
  }

  function compress(names){
    const groups=new Map(); const pool=[...names];
    for(let len=4;len>=2;len--){
      const b={};
      pool.forEach(n=>{ if(n.length<=len) return; (b[n.slice(0,len)]=b[n.slice(0,len)]||[]).push(n); });
      Object.entries(b).forEach(([p,ms])=>{
        if(ms.length<2) return;
        const before=ms.reduce((a,n)=>a+n.length+1,0)-1;
        const tails=ms.map(n=>n.slice(len));
        const after=p.length+2+tails.reduce((a,t)=>a+t.length+1,0)-1;
        if(after>=before) return;
        groups.set(p,tails);
        ms.forEach(n=>{ const i=pool.indexOf(n); if(i>=0) pool.splice(i,1); });
      });
    }
    const out=[]; groups.forEach((t,p)=>out.push(`${p}(${t.join("|")})`));
    pool.forEach(n=>out.push(n)); return out;
  }
  const chunk=(toks,lim)=>{
    const segs=[]; let cur="";
    toks.forEach(t=>{ const nx=cur?cur+"|"+t:t;
      if(nx.length>lim&&cur){ segs.push(cur); cur=t; } else cur=nx; });
    if(cur) segs.push(cur); return segs;
  };

  function refresh(){
    const chosen=SCARABS.filter(s=>picked.has(s.name));
    const known=chosen.filter(s=>s.price!=null);
    const sum=known.reduce((a,s)=>a+inC(s),0);
    $s("ssum").textContent = `${chosen.length} 種 · ${sum.toLocaleString("en-US")}c`
      + (known.length<chosen.length?`（${chosen.length-known.length} 種未定價）`:"");
    const segs=chunk(compress(chosen.map(s=>s.name)),250);
    $s("sboxout").innerHTML = segs.length ? segs.map((t,i)=>`
      <div class="sseg">
        <div class="ssegh"><span>${segs.length>1?`第 ${i+1}/${segs.length} 段 · `:""}${t.length} 字</span>
          <button class="ssq" data-seg="sseg-${i}">複製</button></div>
        <textarea readonly spellcheck="false" id="sseg-${i}">${t.replace(/</g,"&lt;")}</textarea>
      </div>`).join("") : `<div class="sempty">勾選後這裡會列出名單</div>`;
  }

  $s("sq").addEventListener("input",draw);
  $s("ssort").addEventListener("change",e=>{ sort=e.target.value; draw(); });
  ["C","D"].forEach(u=>{ $s("su"+u).onclick=()=>{ thrUnit=u; paintChips(); }; });
  $s("sgo").onclick=()=>{
    const raw=parseFloat($s("sthr").value);
    if(!isFinite(raw)||raw<0){ alert("請輸入一個數字。"); return; }
    const line=thrUnit==="D"?raw*RATE:raw;
    picked.clear();
    SCARABS.forEach(s=>{ const v=inC(s); if(v!=null&&v>=line) picked.add(s.name); });
    saveP(); draw(); refresh();
  };
  $s("sthr").addEventListener("keydown",e=>{ if(e.key==="Enter") $s("sgo").click(); });
  $s("sall").onclick=()=>{ SCARABS.forEach(s=>picked.add(s.name)); saveP(); draw(); refresh(); };
  $s("snone").onclick=()=>{ picked.clear(); saveP(); draw(); refresh(); };
  /* 匯出成新的 scarabs.js */
  $s("sexp").onclick=()=>{
    const q=x=>JSON.stringify(x);
    const lines=["/* ============================================================",
      "   聖甲蟲資料 —— 由工具箱匯出　"+new Date().toLocaleString("zh-TW"),
      "   價格可以直接在網頁上改，改完按「匯出」覆蓋這個檔案即可。",
      "   ============================================================ */","","const SCARABS = [",""];
    let last=null;
    SCARABS.forEach(s=>{
      if(s.group!==last){ lines.push(`  /* ── ${s.group} ── */`); last=s.group; }
      const use=Array.isArray(s.use)?"["+s.use.map(q).join(", ")+"]":q(s.use||"");
      const parts=[`group:${q(s.group)}`,`name:${q(s.name)}`];
      if(s.en) parts.push(`en:${q(s.en)}`);
      parts.push(`use:${use}`);
      if(s.limit) parts.push(`limit:${s.limit}`);
      if(s.price!=null) parts.push(`price:${s.price}`,`unit:${q(s.unit||"C")}`);
      lines.push("  { "+parts.join(", ")+" },");
    });
    lines.push("","];","");
    const blob=new Blob([lines.join("\n")],{type:"text/javascript;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="scarabs.js"; a.click();
    URL.revokeObjectURL(a.href);
  };

  $s("sclr").onclick=()=>{
    if(!confirm("要清除記住的勾選和改過的價格嗎？")) return;
    picked.clear(); over={};
    try{ localStorage.removeItem(KEY); localStorage.removeItem(PKEY); }catch(e){}
    location.reload();
  };

  function togglePick(name,on,row){
    if(on) picked.add(name); else picked.delete(name);
    row.classList.toggle("on",on);
    const cb=row.querySelector(".spick"); if(cb) cb.checked=on;
    saveP(); refresh();
  }
  $s("slist").addEventListener("change",e=>{
    const cb=e.target.closest(".spick"); if(!cb) return;
    togglePick(cb.dataset.n, cb.checked, cb.closest(".srow"));
  });
  /* 點整列任何地方都能勾選（選取文字時不觸發） */
  $s("slist").addEventListener("click",e=>{
    if(e.target.closest(".spick")||e.target.closest(".sprice")) return;
    const row=e.target.closest(".srow"); if(!row) return;
    if(String(window.getSelection?.()||"").length) return;
    const cb=row.querySelector(".spick"); if(!cb) return;
    togglePick(cb.dataset.n, !cb.checked, row);
  });
  /* 改價格 */
  $s("slist").addEventListener("change",e=>{
    const inp=e.target.closest(".pin"); if(!inp) return;
    const nm=inp.dataset.n, it=SCARABS.find(x=>x.name===nm); if(!it) return;
    const raw=inp.value.trim().replace(/[,\s]/g,"");
    if(raw===""){ over[nm]=null; delete it.price; delete it.unit; }
    else{
      const n=parseFloat(raw);
      if(!isFinite(n)||n<0){ inp.value=it.price??""; return; }
      it.price=n; it.unit=it.unit||"C"; over[nm]={p:n,u:it.unit};
    }
    saveO(); draw(); refresh();
  });
  $s("slist").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.target.closest(".pin")) e.target.blur();
  });
  /* 切換混沌／神聖 */
  $s("slist").addEventListener("click",e=>{
    const btn=e.target.closest(".pun"); if(!btn) return;
    e.stopPropagation();
    const it=SCARABS.find(x=>x.name===btn.dataset.n); if(!it||it.price==null) return;
    it.unit = it.unit==="D" ? "C" : "D";
    over[it.name]={p:it.price,u:it.unit};
    saveO(); draw(); refresh();
  },true);

  document.getElementById("tab-scarab").addEventListener("click",e=>{
    const btn=e.target.closest(".ssq"); if(!btn) return;
    const ta=document.getElementById(btn.dataset.seg); if(!ta||!ta.value) return;
    const done=()=>{ btn.textContent="已複製"; btn.classList.add("done");
      setTimeout(()=>{btn.textContent="複製";btn.classList.remove("done");},1400); };
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();});
    else { ta.select(); try{document.execCommand("copy");done();}catch(_){} }
  });

  loadO(); applyOver();
  loadP(); famList(); draw(); paintChips(); refresh();
  Promise.all(["C","D"].map(findCoin)).then(r=>{ if(r.some(Boolean)){ draw(); paintChips(); } });
}

})();
</script>
<script>
(function(){
  const $g=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  const RATE=(typeof DIVINE_RATE!=="undefined")?DIVINE_RATE:200;
  const KEY="poe-tool/strats";

  const base = (typeof STRATS!=="undefined") ? STRATS : [];
  let list = base.map(x=>JSON.parse(JSON.stringify(x)));
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const v=JSON.parse(raw); if(Array.isArray(v)) list=v; }
  }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} };

  const SC = (typeof SCARABS!=="undefined") ? SCARABS : [];
  /* 圖檔名和 scarabs.js 的名稱不一定一致（圖檔常多一個「聖甲蟲：」前綴），
     所以比對前先把前綴和空白拿掉，兩種寫法都認得。 */
  /* 從遊戲或網頁複製常夾帶零寬字元，肉眼看不到但檔名會對不上，先濾掉 */
  const clean = n => String(n??"").replace(/[​-‍⁠﻿]/g,"").trim();
  const bare = n => clean(n).replace(/^聖甲蟲\s*[：:・·\-]?\s*/,"").replace(/\s+/g,"");
  const findSc = n => SC.find(s=>s.name===n) || SC.find(s=>bare(s.name)===bare(n));
  const inC = s => !s||s.price==null ? null : (s.unit==="D"?s.price*RATE:s.price);

  const arr = v => v==null ? [] : (Array.isArray(v)?v:String(v).split(/\n+/).filter(x=>x.trim()));

  /* 圖片：img/icon/<名稱>.png|jpg|jpeg|webp，找不到就用菱形佔位 */
  const EXT=[".png",".jpg",".jpeg",".webp"];
  window.poeIcoNext = function(img){
    if(!img || !img.dataset || !img.dataset.c) return;
    const list=img.dataset.c.split("|");
    let i=+img.dataset.i+1;
    if(i<list.length){ img.dataset.i=i; img.src=list[i]; return; }
    const ph=document.createElement("span");
    ph.className=img.className+" gph";
    img.replaceWith(ph);
  };
  /* 圖檔候選：先照原名找，找不到再試「聖甲蟲：X」和去掉前綴的「X」，
     所以 strats.js 寫哪一種都能吃到同一張圖 */
  function ico(name, cls){
    if(!clean(name)) return "";
    const b=bare(name);
    const names=[...new Set([clean(name), "聖甲蟲："+b, b])];
    const list=[];
    names.forEach(n=>EXT.forEach(e=>list.push("img/icon/"+encodeURIComponent(n+e))));
    return `<img class="${cls}" src="${list[0]}" data-c="${esc(list.join("|"))}" data-i="0"
      alt="" loading="lazy" onerror="poeIcoNext(this)">`;
  }

  /* 一列 = 圖示 + 名稱 ………… ×N。點下去開詳細視窗。
     紅色「查無資料」由 markMissing() 事後補上——scarabs.js 沒有、
     img/item 也沒有截圖的才算真的查不到，這樣打錯字才會浮出來。 */
  function scLine(x, si, i){
    return `<div class="gsc" data-sc="${si}" data-i="${i}" role="button" tabindex="0">
      ${ico(x.name,"gico")}
      <span class="gsn">${esc(x.name)}</span>
      <span class="gn">×${x.n||1}</span>
    </div>`;
  }

  const shotCache={};
  function probeShot(name){
    if(name in shotCache) return Promise.resolve(shotCache[name]);
    const c=shotUrls(name);
    return new Promise(res=>{
      let i=0;
      const next=()=>{
        if(i>=c.length){ shotCache[name]=null; return res(null); }
        const url=c[i++], im=new Image();
        im.onload=()=>{ shotCache[name]=url; res(url); };
        im.onerror=next; im.src=url;
      };
      next();
    });
  }
  function markMissing(){
    $g("glist").querySelectorAll(".gsc").forEach(row=>{
      const x=(list[+row.dataset.i]?.scarabs||[])[+row.dataset.sc];
      if(!x || findSc(x.name)) return;
      probeShot(x.name).then(u=>{
        if(u || row.querySelector(".gbad") || !row.parentNode) return;
        row.querySelector(".gsn").insertAdjacentHTML("afterend",
          '<span class="gbad">查無資料</span>');
      });
    });
  }

  /* 任何文字欄位裡寫 [[名稱]]，就變成「小圖示 + 名稱」，點下去開同一個詳細視窗。
     steps / warn / atlas / note / mods / 方案說明 都吃這個寫法。 */
  function refChip(raw){
    const n=clean(raw);
    if(!n) return "";
    return `<span class="gref" data-ref="${esc(n)}" role="button" tabindex="0"
      >${ico(n,"grico")}<span>${esc(n)}</span></span>`;
  }
  function rich(t){
    const s=String(t??"");
    const re=/\[\[([^\[\]]+)\]\]/g;
    let out="", last=0, m;
    while((m=re.exec(s))){ out+=esc(s.slice(last,m.index))+refChip(m[1]); last=re.lastIndex; }
    return out+esc(s.slice(last));
  }

  function sec(label, inner){ return inner ? `<div class="gsec"><span class="glab">${label}</span>${inner}</div>` : ""; }
  const stars = n => { n=Math.max(0,Math.min(5,+n||0));
    return `<span class="gstar">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`; };
  function rateRow(st){
    const items=[["推薦度",st.rec],["難度",st.diff],["造價",st.cost]].filter(x=>x[1]);
    if(!items.length) return "";
    return `<div class="grate">${items.map(([k,v])=>
      `<span><em>${k}</em>${stars(v)}</span>`).join("")}</div>`;
  }
  function variants(st){
    const vs=st.variants||[];
    if(!vs.length) return "";
    return vs.map((v,i)=>`<div class="gvar">
      <div class="gvh">${esc(v.name||("方案 "+(i+1)))}</div>
      ${v.atlas?`<div class="gvr"><span>天賦</span><b>${rich(v.atlas)}</b></div>`:""}
      ${v.map?`<div class="gvr"><span>地圖</span><b class="gmap">${ico(v.map,"gmico")}${esc(v.map)}</b></div>`:""}
      ${v.mods?`<div class="gvr"><span>詞綴</span><b>${rich(v.mods)}</b></div>`:""}
      ${v.why?`<div class="gvw">${rich(v.why)}</div>`:""}
    </div>`).join("");
  }
  const ul = (items,cls) => items.length
    ? `<ul class="gul ${cls||""}">${items.map(t=>`<li>${rich(t)}</li>`).join("")}</ul>` : "";

  /* 卡片區塊 —— 顯示順序照你在 strats.js 裡寫欄位的順序。
     沒寫到的欄位用下面這個預設順序補在後面。 */
  const SECT = {
    scarabs:(st,i)=>sec("地圖碎片",(st.scarabs||[]).map((x,si)=>scLine(x,si,i)).join("")),
    variants:st=>sec("方案", variants(st)),
    map:  st=>sec("地圖", st.map?`<div class="gtxt gmap">${ico(st.map,"gmico")}${esc(st.map)}</div>`:""),
    mods: st=>sec("地圖詞綴", st.mods?`<div class="gtxt">${rich(st.mods)}</div>`:""),
    atlas:st=>sec("天賦重點", ul(arr(st.atlas))),
    steps:st=>sec("操作順序", ul(arr(st.steps))),
    warn: st=>sec("注意事項", ul(arr(st.warn),"warn")),
    link: st=>st.link?`<div class="gsec"><span class="glab">參考</span>
      <a class="glink" href="${esc(st.link)}" target="_blank" rel="noopener">${esc(st.link)}</a></div>`:"",
  };
  const SECT_ORDER = Object.keys(SECT);
  /* 物件的 key 順序就是你寫的順序（JSON 存取也保留），拿來當顯示順序 */
  function bodyKeys(st){
    const mine=Object.keys(st).filter(k=>k in SECT);
    return [...mine, ...SECT_ORDER.filter(k=>!mine.includes(k))];
  }

  function card(st,i){
    return `<div class="gcard">
      <div class="ghead">
        <div class="gname">${esc(st.name||"（未命名）")}
          ${st.tag?`<span class="gtag">${esc(st.tag)}</span>`:""}</div>
        ${st.note?`<div class="gnote">${rich(st.note)}</div>`:""}
        ${rateRow(st)}
      </div>
      <div class="gbody">
        ${bodyKeys(st).map(k=>SECT[k](st,i)).join("")}
      </div>
      <div class="gact">
        <button data-act="edit" data-i="${i}">編輯</button>
        <button data-act="copy" data-i="${i}">複製一份</button>
        <button class="del" data-act="del" data-i="${i}">刪除</button>
      </div>
    </div>`;
  }

  function draw(){
    const term=$g("gq").value.trim().toLowerCase();
    const show=list.map((st,i)=>({st,i})).filter(({st})=>{
      if(!term) return true;
      const hay=[st.name,st.tag,st.note,st.map,st.mods,
        ...(st.scarabs||[]).map(x=>x.name+" "+(x.why||"")),
        ...arr(st.atlas),...arr(st.steps),...arr(st.warn),
        ...(st.variants||[]).map(v=>[v.name,v.atlas,v.map,v.mods,v.why].filter(Boolean).join(" "))
      ].join(" ").toLowerCase();
      return hay.includes(term);
    });
    $g("gtally").innerHTML=`<b>${show.length}</b> 套策略`;
    $g("glist").innerHTML = show.length
      ? show.map(({st,i})=>card(st,i)).join("")
      : `<div class="gnone">沒有符合的策略。<br>按右上角「＋ 新增策略」建一套。</div>`;
    markMissing();
  }

  /* ---------- 甲蟲詳細視窗 ---------- */
  /* 提示框截圖：img/item/<名稱>.<副檔名>，跟掉落查詢器同一個資料夾、同一套命名。
     候選名一樣試三種寫法（原名 / 加「聖甲蟲：」/ 去前綴）。 */
  function shotUrls(name){
    const b=bare(name);
    const out=[];
    [...new Set([clean(name),"聖甲蟲："+b,b])].forEach(n=>
      EXT.forEach(e=>out.push("img/item/"+encodeURIComponent(n+e))));
    return out;
  }
  /* 全部候選都試完還是沒有 → 拿掉截圖，露出底下的文字說明 */
  window.poeShotNext = function(img){
    if(!img||!img.dataset||!img.dataset.c) return;
    const c=img.dataset.c.split("|");
    let i=+img.dataset.i+1;
    if(i<c.length){ img.dataset.i=i; img.src=c[i]; return; }
    const dlg=img.closest(".sdlg");
    img.remove();
    if(dlg) dlg.classList.add("solo");
    const fb=document.getElementById("sfall");
    if(fb) fb.hidden=false;
  };

  /* 甲蟲列和文字裡的 [[名稱]] 共用這一個視窗。n 留空就不顯示數量。 */
  function openItem(rawName, n){
    const name=clean(rawName); if(!name) return;
    const s=findSc(name);
    const uses=arr(s&&s.use);
    const u=shotUrls(name);
    $g("ssheet").innerHTML=`
      <div class="sdlg">
        ${ico(name,"sbig")}
        <img class="sshot" src="${u[0]}" data-c="${esc(u.join("|"))}" data-i="0"
          alt="${esc(name)}" onerror="poeShotNext(this)">
      </div>
      <div class="sname">${esc(name)}</div>
      ${s&&s.en?`<div class="sen">${esc(s.en)}</div>`:""}
      ${n?`<div class="sqty">×${n}</div>`:""}

      <div id="sfall" hidden>
        ${s
          ? (uses.length?`<div class="ssec"><span class="glab">遊戲內效果</span>
              <ul class="suse">${uses.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:"")
          : `<div class="ssec"><span class="glab">查無資料</span>
              <div class="smiss">聖甲蟲分頁裡也沒有「${esc(name)}」。<br>
              可能是打錯字，也可能它本來就不是聖甲蟲。</div></div>`}
        <div class="snoshot">還沒有這個物品的提示框截圖。<br>
          存成 <code>img\\item\\${esc(name)}.png</code> 就會自動出現。</div>
      </div>

      `;
    $g("sveil").classList.add("on");
  }
  function openSc(i, si){
    const x=(list[i]?.scarabs||[])[si]; if(!x) return;
    openItem(x.name, x.n||1);
  }
  const closeSc = () => $g("sveil").classList.remove("on");

  /* ---------- 編輯視窗 ---------- */
  const toText = v => arr(v).join("\n");
  const varToText = vs => (vs||[]).map(v=>
    ["@"+(v.name||""), v.atlas?"天賦 "+v.atlas:"", v.map?"地圖 "+v.map:"",
     v.mods?"詞綴 "+v.mods:"", v.why?"說明 "+v.why:""].filter(Boolean).join("\n")).join("\n\n");
  function textToVar(t){
    const out=[]; let cur=null;
    t.split(/\n/).forEach(raw=>{
      const l=raw.trim(); if(!l) return;
      if(l.startsWith("@")){ cur={name:l.slice(1).trim()}; out.push(cur); return; }
      if(!cur){ cur={name:""}; out.push(cur); }
      const m=l.match(/^(天賦|地圖|詞綴|說明)\s+(.*)$/);
      if(m){ cur[{天賦:"atlas",地圖:"map",詞綴:"mods",說明:"why"}[m[1]]]=m[2].trim(); }
      else { cur.why=(cur.why?cur.why+" ":"")+l; }
    });
    return out;
  }
  const scToText = a => (a||[]).map(x=>
    `${x.n||1} ${x.name}${x.why?" | "+x.why:""}`).join("\n");
  function textToSc(t){
    return t.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
      const [head,why]=l.split("|").map(s=>s.trim());
      const m=head.match(/^(\d+)\s+(.+)$/);
      return m ? {name:m[2].trim(), n:+m[1], ...(why?{why}:{})}
               : {name:head, n:1, ...(why?{why}:{})};
    });
  }

  function editor(i){
    const isNew = i<0;
    const st = isNew ? {name:"",scarabs:[]} : list[i];
    $g("gsheet").innerHTML=`
      <h3>${isNew?"新增策略":"編輯策略"}</h3>
      <div class="ghint" style="margin-bottom:14px">卡片上的區塊順序照 <code>strats.js</code>
        裡欄位的先後順序，在這裡編輯不會把順序打亂。</div>
      <div class="gfield"><label>名稱</label>
        <input id="f-name" value="${esc(st.name||"")}" placeholder="例如：惡懼支配 · 神龕堆王"></div>
      <div class="gfield"><label>標籤</label>
        <input id="f-tag" value="${esc(st.tag||"")}" placeholder="例如：低成本高收益"></div>
      <div class="gfield"><label>一句話說明</label>
        <textarea id="f-note" style="min-height:60px">${esc(st.note||"")}</textarea></div>
      <div class="gfield"><label>星級（0～5，留空就不顯示）</label>
        <div style="display:flex;gap:9px">
          <input id="f-rec"  type="number" min="0" max="5" value="${st.rec??""}"  placeholder="推薦度">
          <input id="f-diff" type="number" min="0" max="5" value="${st.diff??""}" placeholder="難度">
          <input id="f-cost" type="number" min="0" max="5" value="${st.cost??""}" placeholder="造價">
        </div>
        <div class="ghint">順序：推薦度 / 難度 / 造價</div></div>
      <div class="gfield"><label>聖甲蟲配置</label>
        <textarea id="f-sc">${esc(scToText(st.scarabs))}</textarea>
        <div class="ghint">一行一個，格式：<b>數量 聖甲蟲名稱 | 為什麼放它</b>（說明可省略）<br>
          名稱要跟聖甲蟲分頁一致，點卡片上那一列就會顯示效果和說明<br>
          名稱對不上時那一列會標紅色「查無資料」</div></div>
      <div class="gfield"><label>方案（不同天賦／地圖組合）</label>
        <textarea id="f-var">${esc(varToText(st.variants))}</textarea>
        <div class="ghint">一個方案一段，每段用 <b>@</b> 開頭是方案名稱，接著每行一項：<br>
          <code>@夢魘圖專用</code><br><code>天賦 譫妄+地圖+聖甲蟲</code><br>
          <code>地圖 夢魘地圖</code><br><code>詞綴 聖甲蟲 90% 以上</code></div></div>
      <div class="gfield"><label>地圖（只有一種方案時填這裡）</label>
        <input id="f-map" value="${esc(st.map||"")}" placeholder="例如：叢林山谷"></div>
      <div class="gfield"><label>地圖詞綴</label>
        <input id="f-mods" value="${esc(st.mods||"")}" placeholder="例如：數量 100%+、聖甲蟲掉落"></div>
      <div class="gfield"><label>天賦重點</label>
        <textarea id="f-atlas">${esc(toText(st.atlas))}</textarea>
        <div class="ghint">一行一條。想帶出物品圖示就把名稱框起來：<b>[[釋界之聖甲蟲鑿]]</b><br>
          說明、詞綴、操作順序、注意事項、方案說明都能這樣寫，點下去會開圖片視窗</div></div>
      <div class="gfield"><label>操作順序</label>
        <textarea id="f-steps">${esc(toText(st.steps))}</textarea></div>
      <div class="gfield"><label>注意事項</label>
        <textarea id="f-warn">${esc(toText(st.warn))}</textarea></div>
      <div class="gfield"><label>參考連結</label>
        <input id="f-link" value="${esc(st.link||"")}" placeholder="https://…"></div>
      <div class="gbtns">
        <button id="f-cancel">取消</button>
        <button class="pri" id="f-ok">${isNew?"新增":"儲存"}</button>
      </div>`;
    $g("gveil").classList.add("on");
    $g("f-cancel").onclick=()=>$g("gveil").classList.remove("on");
    $g("f-ok").onclick=()=>{
      const val=id=>$g(id).value.trim();
      const obj={ name:val("f-name")||"（未命名）" };
      if(val("f-tag"))  obj.tag=val("f-tag");
      if(val("f-note")) obj.note=val("f-note");
      const sc=textToSc($g("f-sc").value); if(sc.length) obj.scarabs=sc;
      ["rec","diff","cost"].forEach(k=>{
        const n=$g("f-"+k).value.trim(); if(n!=="") obj[k]=Math.max(0,Math.min(5,+n||0));
      });
      const vs=textToVar($g("f-var").value); if(vs.length) obj.variants=vs;
      if(val("f-map"))  obj.map=val("f-map");
      if(val("f-mods")) obj.mods=val("f-mods");
      ["atlas","steps","warn"].forEach(k=>{
        const a=arr($g("f-"+k).value); if(a.length) obj[k]=a;
      });
      if(val("f-link")) obj.link=val("f-link");
      /* 編輯不打亂區塊順序：照原本那筆的欄位順序重排，新欄位擺後面 */
      if(!isNew){
        const keep={};
        [...Object.keys(st), ...Object.keys(obj)].forEach(k=>{
          if(k in obj && !(k in keep)) keep[k]=obj[k];
        });
        list[i]=keep;
      } else list.push(obj);
      save(); $g("gveil").classList.remove("on"); draw();
    };
  }

  /* ---------- 事件 ---------- */
  $g("gq").addEventListener("input",draw);
  $g("gnew").onclick=()=>editor(-1);
  $g("glist").addEventListener("click",e=>{
    const rf=e.target.closest(".gref");
    if(rf){ openItem(rf.dataset.ref); return; }
    const sc=e.target.closest(".gsc");
    if(sc){ openSc(+sc.dataset.i, +sc.dataset.sc); return; }
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const i=+b.dataset.i, act=b.dataset.act;
    if(act==="edit") editor(i);
    if(act==="copy"){ const c=JSON.parse(JSON.stringify(list[i]));
      c.name=(c.name||"")+"（複本）"; list.splice(i+1,0,c); save(); draw(); }
    if(act==="del"){ if(confirm(`確定要刪除「${list[i].name}」嗎？`)){ list.splice(i,1); save(); draw(); } }
  });
  $g("glist").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const rf=e.target.closest?.(".gref");
    if(rf){ e.preventDefault(); return openItem(rf.dataset.ref); }
    const sc=e.target.closest?.(".gsc"); if(!sc) return;
    e.preventDefault(); openSc(+sc.dataset.i, +sc.dataset.sc);
  });
  $g("gveil").addEventListener("click",e=>{ if(e.target===$g("gveil")) $g("gveil").classList.remove("on"); });
  /* 沒有關閉鈕了，所以點視窗任何地方、點背景、按 Esc 都關得掉 */
  $g("sveil").addEventListener("click",closeSc);
  addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    if($g("sveil").classList.contains("on")) return closeSc();
    $g("gveil").classList.remove("on");
  });

  $g("gexp").onclick=()=>{
    const q=x=>JSON.stringify(x);
    const L=["/* ============================================================",
      "   刷圖策略 —— 由工具箱匯出　"+new Date().toLocaleString("zh-TW"),
      "   ============================================================ */","","const STRATS = [",""];
    list.forEach(st=>{
      L.push("  {");
      L.push(`    name: ${q(st.name||"")},`);
      if(st.tag)  L.push(`    tag:  ${q(st.tag)},`);
      if(st.note) L.push(`    note: ${q(st.note)},`);
      ["rec","diff","cost"].forEach(k=>{ if(st[k]!=null) L.push(`    ${k}: ${st[k]},`); });
      /* 照卡片上的順序寫出去，匯出再匯入順序不會跑掉 */
      const OUT={
        scarabs(){
          if(!(st.scarabs||[]).length) return;
          L.push("","    scarabs: [");
          st.scarabs.forEach(x=>L.push(`      { name:${q(x.name)}, n:${x.n||1}${x.why?`, why:${q(x.why)}`:""} },`));
          L.push("    ],");
        },
        variants(){
          if(!(st.variants||[]).length) return;
          L.push("","    variants: [");
          st.variants.forEach(v=>{
            const f=["name","atlas","map","mods","why"].filter(k=>v[k])
              .map(k=>`${k}:${q(v[k])}`).join(", ");
            L.push(`      { ${f} },`);
          });
          L.push("    ],");
        },
        map(){  if(st.map)  L.push("",`    map:  ${q(st.map)},`); },
        mods(){ if(st.mods) L.push("",`    mods: ${q(st.mods)},`); },
        atlas(){ arrOut("atlas"); },
        steps(){ arrOut("steps"); },
        warn(){  arrOut("warn"); },
        link(){ if(st.link) L.push("",`    link: ${q(st.link)},`); },
      };
      function arrOut(k){
        const a=arr(st[k]); if(!a.length) return;
        L.push("",`    ${k}: [`);
        a.forEach(t=>L.push(`      ${q(t)},`));
        L.push("    ],");
      }
      bodyKeys(st).forEach(k=>OUT[k]());
      L.push("  },","");
    });
    L.push("];","");
    const blob=new Blob([L.join("\n")],{type:"text/javascript;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="strats.js"; a.click();
    URL.revokeObjectURL(a.href);
  };

  draw();
})();

</script>
</body>
</html>
